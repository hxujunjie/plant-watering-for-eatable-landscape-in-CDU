<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 栀子剪影 - 白色大花 -->
  <g fill="#d0d0d0" stroke="none">
    <!-- 茎 -->
    <path d="M50,90 Q48,72 48,58 Q48,48 50,42 Q52,48 52,58 Q52,72 50,90Z"/>
    <!-- 叶子 -->
    <path d="M48,68 Q36,62 28,56 Q24,52 26,50 Q30,52 36,56 Q42,62 48,66Z"/>
    <path d="M52,72 Q64,66 72,60 Q76,56 74,54 Q70,56 64,60 Q58,66 52,70Z"/>
    <!-- 大花 -->
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(0 50 28)"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(60 50 28)"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(120 50 28)"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(180 50 28)"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(240 50 28)"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(300 50 28)"/>
    <!-- 花心 -->
    <circle cx="50" cy="28" r="5" fill="#c8c8c8"/>
  </g>
</svg>