<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 栀子手绘插图 - 白色大花 -->
  <g fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 茎 -->
    <path d="M50,90 Q48,72 48,58 Q48,48 50,42 Q52,48 52,58 Q52,72 50,90Z" stroke="#5a9e5a" stroke-width="2"/>
    <!-- 叶子 -->
    <path d="M48,68 Q36,62 28,56 Q24,52 26,50 Q30,52 36,56 Q42,62 48,66Z" fill="#a8d5a2" stroke="#2c2c2c"/>
    <line x1="36" y1="58" x2="46" y2="64" stroke="#2c2c2c" stroke-width="0.6" opacity="0.4"/>
    <path d="M52,72 Q64,66 72,60 Q76,56 74,54 Q70,56 64,60 Q58,66 52,70Z" fill="#8fc48a" stroke="#2c2c2c"/>
    <line x1="64" y1="62" x2="54" y2="68" stroke="#2c2c2c" stroke-width="0.6" opacity="0.4"/>
    <!-- 大花 - 6瓣 -->
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(0 50 28)" fill="#f8f8f0" stroke="#2c2c2c"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(60 50 28)" fill="#f0f0e8" stroke="#2c2c2c"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(120 50 28)" fill="#f8f8f0" stroke="#2c2c2c"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(180 50 28)" fill="#f0f0e8" stroke="#2c2c2c"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(240 50 28)" fill="#f8f8f0" stroke="#2c2c2c"/>
    <ellipse cx="50" cy="28" rx="8" ry="14" transform="rotate(300 50 28)" fill="#f0f0e8" stroke="#2c2c2c"/>
    <!-- 花心 -->
    <circle cx="50" cy="28" r="5" fill="#f0e8a0" stroke="#2c2c2c" stroke-width="1"/>
    <!-- 花萼 -->
    <path d="M46,40 Q44,44 42,46 Q46,44 48,40Z" fill="#5a9e5a" stroke="#2c2c2c"/>
    <path d="M54,40 Q56,44 58,46 Q54,44 52,40Z" fill="#5a9e5a" stroke="#2c2c2c"/>
  </g>
</svg>