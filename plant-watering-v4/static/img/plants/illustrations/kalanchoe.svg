<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 长寿花手绘插图 - 小花簇 -->
  <g fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 茎 -->
    <path d="M50,90 Q48,70 48,55 Q48,48 50,44 Q52,48 52,55 Q52,70 50,90Z" stroke="#5a9e5a" stroke-width="2"/>
    <!-- 叶子 -->
    <path d="M48,65 Q38,60 30,56 Q26,54 28,52 Q32,54 38,58 Q44,62 48,64Z" fill="#a8d5a2" stroke="#2c2c2c"/>
    <path d="M52,68 Q62,63 70,59 Q74,57 72,55 Q68,57 62,61 Q56,65 52,67Z" fill="#8fc48a" stroke="#2c2c2c"/>
    <!-- 花簇 - 橙红色小花 -->
    <circle cx="50" cy="30" r="8" fill="#e8a060" stroke="#2c2c2c"/>
    <circle cx="42" cy="34" r="7" fill="#e89050" stroke="#2c2c2c"/>
    <circle cx="58" cy="34" r="7" fill="#e8a868" stroke="#2c2c2c"/>
    <circle cx="46" cy="24" r="6" fill="#f0b070" stroke="#2c2c2c"/>
    <circle cx="54" cy="24" r="6" fill="#e89858" stroke="#2c2c2c"/>
    <circle cx="38" cy="28" r="5" fill="#f0b878" stroke="#2c2c2c"/>
    <circle cx="62" cy="28" r="5" fill="#e8a060" stroke="#2c2c2c"/>
    <!-- 花心 -->
    <circle cx="50" cy="30" r="3" fill="#f0d0a0" stroke="#2c2c2c" stroke-width="0.8"/>
    <circle cx="42" cy="34" r="2.5" fill="#f0d0a0" stroke="#2c2c2c" stroke-width="0.8"/>
    <circle cx="58" cy="34" r="2.5" fill="#f0d0a0" stroke="#2c2c2c" stroke-width="0.8"/>
    <!-- 花萼 -->
    <path d="M48,42 Q46,44 44,46 Q46,44 48,42Z" fill="#5a9e5a" stroke="#2c2c2c"/>
    <path d="M52,42 Q54,44 56,46 Q54,44 52,42Z" fill="#5a9e5a" stroke="#2c2c2c"/>
  </g>
</svg>