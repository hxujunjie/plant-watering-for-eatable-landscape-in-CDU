    <path d="M52,62 Q62,56 70,52 Q74,50 72,48 Q68,50 62,54 Q56,58 52,60Z" fill="#8fc48a" stroke="#2c2c2c"/>
    <!-- 辣椒1（红色下垂） -->
    <path d="M48,40 Q44,34 38,28 Q34,24 32,22 Q30,20 32,18 Q36,18 40,22 Q46,28 50,36 Q52,38 50,40Z" fill="#e85050" stroke="#2c2c2c"/>
