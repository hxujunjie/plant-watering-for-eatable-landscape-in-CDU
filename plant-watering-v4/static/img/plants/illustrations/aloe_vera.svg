<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 芦荟手绘插图 - 剑形叶子丛生 -->
  <g fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 中心叶 -->
    <path d="M50,90 Q48,70 47,50 Q46,35 48,20 Q50,12 52,20 Q54,35 53,50 Q52,70 50,90Z" fill="#a8d5a2" stroke="#2c2c2c"/>
    <!-- 左叶1 -->
    <path d="M50,90 Q44,72 38,55 Q34,42 30,32 Q28,26 32,24 Q36,26 40,34 Q44,44 48,58 Q50,68 50,78Z" fill="#8fc48a" stroke="#2c2c2c"/>
    <!-- 右叶1 -->
    <path d="M50,90 Q56,72 62,55 Q66,42 70,32 Q72,26 68,24 Q64,26 60,34 Q56,44 52,58 Q50,68 50,78Z" fill="#7ab875" stroke="#2c2c2c"/>
    <!-- 左叶2 -->
    <path d="M50,90 Q42,76 34,62 Q28,52 22,44 Q18,38 22,36 Q26,38 30,44 Q36,52 44,66 Q48,74 50,82Z" fill="#b8e0b2" stroke="#2c2c2c"/>
    <!-- 右叶2 -->
    <path d="M50,90 Q58,76 66,62 Q72,52 78,44 Q82,38 78,36 Q74,38 70,44 Q64,52 56,66 Q52,74 50,82Z" fill="#a8d5a2" stroke="#2c2c2c"/>
    <!-- 左叶3 -->
    <path d="M50,90 Q40,80 30,70 Q22,62 16,56 Q12,52 16,50 Q20,52 26,56 Q34,62 44,74 Q48,80 50,86Z" fill="#8fc48a" stroke="#2c2c2c"/>
    <!-- 右叶3 -->
    <path d="M50,90 Q60,80 70,70 Q78,62 84,56 Q88,52 84,50 Q80,52 74,56 Q66,62 56,74 Q52,80 50,86Z" fill="#7ab875" stroke="#2c2c2c"/>
    <!-- 叶片上的斑点 -->
    <circle cx="49" cy="40" r="1" fill="#2c2c2c" opacity="0.2"/>
    <circle cx="49" cy="50" r="1" fill="#2c2c2c" opacity="0.2"/>
    <circle cx="49" cy="60" r="1" fill="#2c2c2c" opacity="0.2"/>
    <circle cx="51" cy="45" r="1" fill="#2c2c2c" opacity="0.2"/>
    <circle cx="51" cy="55" r="1" fill="#2c2c2c" opacity="0.2"/>
    <!-- 叶脉 -->
    <line x1="50" y1="20" x2="50" y2="85" stroke="#2c2c2c" stroke-width="0.6" opacity="0.3"/>
  </g>
</svg>