<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 仙人掌手绘插图 - 圆柱形仙人掌 -->
  <g fill="none" stroke="#2c2c2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 主茎 -->
    <rect x="38" y="25" width="24" height="55" rx="12" fill="#a8d5a2" stroke="#2c2c2c"/>
    <!-- 左臂 -->
    <path d="M38,50 Q28,50 22,45 Q16,40 16,35 Q16,28 22,26 Q28,24 30,30 Q32,36 34,42 Q36,46 38,48Z" fill="#8fc48a" stroke="#2c2c2c"/>
    <!-- 右臂 -->
    <path d="M62,55 Q72,55 78,50 Q84,45 84,40 Q84,33 78,31 Q72,29 70,35 Q68,41 66,47 Q64,51 62,53Z" fill="#7ab875" stroke="#2c2c2c"/>
    <!-- 纵棱线 -->
    <line x1="44" y1="28" x2="44" y2="78" stroke="#2c2c2c" stroke-width="0.6" opacity="0.3"/>
    <line x1="50" y1="26" x2="50" y2="80" stroke="#2c2c2c" stroke-width="0.6" opacity="0.3"/>
    <line x1="56" y1="28" x2="56" y2="78" stroke="#2c2c2c" stroke-width="0.6" opacity="0.3"/>
    <!-- 刺 -->
    <line x1="38" y1="35" x2="32" y2="32" stroke="#2c2c2c" stroke-width="1.2"/>
    <line x1="62" y1="35" x2="68" y2="32" stroke="#2c2c2c" stroke-width="1.2"/>
    <line x1="38" y1="50" x2="32" y2="48" stroke="#2c2c2c" stroke-width="1.2"/>
    <line x1="62" y1="50" x2="68" y2="48" stroke="#2c2c2c" stroke-width="1.2"/>
    <line x1="38" y1="65" x2="32" y2="63" stroke="#2c2c2c" stroke-width="1.2"/>
    <line x1="62" y1="65" x2="68" y2="63" stroke="#2c2c2c" stroke-width="1.2"/>
    <!-- 小花 -->
    <circle cx="50" cy="22" r="5" fill="#f0c8d8" stroke="#2c2c2c" stroke-width="1"/>
    <circle cx="46" cy="20" r="3" fill="#f0b8c8" stroke="#2c2c2c" stroke-width="0.8"/>
    <circle cx="54" cy="20" r="3" fill="#f0b8c8" stroke="#2c2c2c" stroke-width="0.8"/>
    <circle cx="50" cy="18" r="2.5" fill="#e8a8b8" stroke="#2c2c2c" stroke-width="0.8"/>
  </g>
</svg>