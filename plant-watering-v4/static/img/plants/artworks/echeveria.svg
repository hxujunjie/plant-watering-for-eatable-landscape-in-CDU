  <path d="M24 34h55M162 34h54M24 266h54M162 266h54" stroke="#927d5e" stroke-width="1" opacity=".42"/>
  <text x="24" y="55" font-family="serif" font-size="7" fill="#6f5d4a" opacity=".62" transform="rotate(-4 24 55)">specimen study</text>
  <text x="158" y="55" font-family="serif" font-size="7" fill="#6f5d4a" opacity=".62" transform="rotate(-4 158 55)">莲座肉叶</text>
  <path d="M51 58L92 92" stroke="#6f5d4a" stroke-width=".8" opacity=".38" stroke-dasharray="3 3"/>
  <path d="M184 58L151 94" stroke="#6f5d4a" stroke-width=".8" opacity=".38" stroke-dasharray="3 3"/>
