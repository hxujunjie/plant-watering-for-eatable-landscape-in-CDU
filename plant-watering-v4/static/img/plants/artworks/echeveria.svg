        <ellipse cx="76" cy="0" rx="20" ry="56" transform="rotate(90 76 0)"/><ellipse cx="54" cy="54" rx="20" ry="56" transform="rotate(135 54 54)"/>
        <ellipse cx="0" cy="76" rx="20" ry="56"/><ellipse cx="-54" cy="54" rx="20" ry="56" transform="rotate(45 -54 54)"/>
        <ellipse cx="-76" cy="0" rx="20" ry="56" transform="rotate(90 -76 0)"/><ellipse cx="-54" cy="-54" rx="20" ry="56" transform="rotate(135 -54 -54)"/>
      </g>
