<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- 小书架 - 手绘风格 -->
  <g fill="none" stroke="#2c2c2c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 书架底板 -->
    <line x1="16" y1="62" x2="64" y2="62" stroke="#2c2c2c" stroke-width="2.5"/>
    <!-- 书1 - 绿色 -->
    <rect x="20" y="30" width="10" height="32" rx="1" fill="#a8d5a2" stroke="#2c2c2c"/>
    <line x1="22" y1="34" x2="28" y2="34" stroke="#2c2c2c" stroke-width="0.8" opacity="0.5"/>
    <line x1="22" y1="38" x2="26" y2="38" stroke="#2c2c2c" stroke-width="0.8" opacity="0.5"/>
    <!-- 书2 - 棕色 -->
    <rect x="32" y="24" width="8" height="38" rx="1" fill="#d4b896" stroke="#2c2c2c"/>
    <line x1="34" y1="28" x2="38" y2="28" stroke="#2c2c2c" stroke-width="0.8" opacity="0.5"/>
    <!-- 书3 - 蓝色 -->
    <rect x="42" y="32" width="10" height="30" rx="1" fill="#a8c8e0" stroke="#2c2c2c"/>
    <line x1="44" y1="36" x2="50" y2="36" stroke="#2c2c2c" stroke-width="0.8" opacity="0.5"/>
    <line x1="44" y1="40" x2="48" y2="40" stroke="#2c2c2c" stroke-width="0.8" opacity="0.5"/>
    <!-- 书4 - 粉色（倾斜） -->
    <path d="M54,34 L56,28 L64,30 L62,62 L54,62Z" fill="#f0c8c8" stroke="#2c2c2c"/>
    <!-- 小植物装饰 -->
    <circle cx="62" cy="22" r="4" fill="#b8e0b2" stroke="#2c2c2c" stroke-width="1.2"/>
    <line x1="62" y1="26" x2="62" y2="30" stroke="#2c2c2c" stroke-width="1.2"/>
  </g>
</svg>