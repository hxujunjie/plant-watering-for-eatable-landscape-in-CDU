<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- 日历打勾 - 手绘风格 -->
  <g fill="none" stroke="#2c2c2c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 日历顶部 -->
    <rect x="16" y="16" width="48" height="52" rx="3" fill="#fff8e8" stroke="#2c2c2c"/>
    <!-- 日历挂钩 -->
    <line x1="28" y1="12" x2="28" y2="20" stroke="#2c2c2c" stroke-width="2.5"/>
    <line x1="52" y1="12" x2="52" y2="20" stroke="#2c2c2c" stroke-width="2.5"/>
    <!-- 日历顶部色条 -->
    <rect x="16" y="16" width="48" height="10" rx="3" fill="#f0d0a0" stroke="#2c2c2c" stroke-width="1.2"/>
    <!-- 日历格子线 -->
    <line x1="16" y1="34" x2="64" y2="34" stroke="#2c2c2c" stroke-width="0.8" opacity="0.4"/>
    <line x1="16" y1="44" x2="64" y2="44" stroke="#2c2c2c" stroke-width="0.8" opacity="0.4"/>
    <line x1="16" y1="54" x2="64" y2="54" stroke="#2c2c2c" stroke-width="0.8" opacity="0.4"/>
    <!-- 大勾 -->
    <path d="M28,48 Q34,56 42,58 Q52,42 56,36" stroke="#5a9e5a" stroke-width="3.5" fill="none"/>
  </g>
</svg>