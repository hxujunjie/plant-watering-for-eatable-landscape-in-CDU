{% extends "base.html" %}

{% block title %}植物图鉴{% endblock %}

{% block content %}
<div class="header header-compact">
    <div class="header-badge">CODEX</div>
    <h1>植物图鉴</h1>
    <div class="header-divider">
        <div class="line"></div>
        <div class="leaf">📖</div>
        <div class="line"></div>
    </div>
</div>

<!-- 植物园状态 -->
<div class="codex-progress-bar" id="codexProgress">
    <div class="codex-progress-text" id="codexProgressText">这片小小的植物园，正等着第一位住客</div>
</div>

<!-- 分类筛选 -->
<div class="codex-category-tabs" id="codexCategoryTabs">
    <button class="codex-cat-tab active" data-category="all">全部</button>
    <button class="codex-cat-tab" data-category="观叶">观叶</button>
    <button class="codex-cat-tab" data-category="多肉">多肉</button>
    <button class="codex-cat-tab" data-category="花卉">花卉</button>
    <button class="codex-cat-tab" data-category="蔬果">蔬果</button>
    <button class="codex-cat-tab" data-category="自定义">自定义</button>
</div>

<!-- 植物卡片网格 -->
<div class="codex-grid" id="codexGrid">
    <!-- 由JS动态渲染 -->
</div>

<!-- 空状态 -->
<div class="codex-empty" id="codexEmpty" style="display:none;">
    <div class="empty-icon">🌱</div>
    <div class="empty-title">这片土壤还在等待第一颗种子</div>
    <div class="empty-desc">去记录你的植物，它们就会出现在这里</div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    var codexGrid = document.getElementById('codexGrid');
    var codexEmpty = document.getElementById('codexEmpty');
    var codexProgressText = document.getElementById('codexProgressText');
    var categoryTabs = document.querySelectorAll('.codex-cat-tab');
    var currentCategory = 'all';
    var allEntries = [];

    // 加载图鉴数据
    function loadCodex() {
        fetch('/api/codex')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                allEntries = data.entries || [];
                // 更新进度
                var unlocked = allEntries.filter(function(e) { return e.unlocked; }).length;
                var incoming = data.incoming_count || 0;
                codexProgressText.innerHTML = getProgressText(unlocked, incoming);
                // 加载提醒数据
                loadReminders();
                renderGrid();
            })
            .catch(function() {
                codexGrid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--accent-rose);font-size:0.85rem;">加载失败</div>';
            });
    }

    function getProgressText(unlocked, incoming) {
        if (unlocked > 0 && incoming > 0) {
            return '你的植物园已有 <strong>' + unlocked + '</strong> 位住客，<strong>' + incoming + '</strong> 位新朋友正在路上';
        }
        if (unlocked > 0) {
            return '你的植物园已有 <strong>' + unlocked + '</strong> 位住客，每一位都在慢慢长大';
        }
        if (incoming > 0) {
            return '你的植物园正在准备迎接 <strong>' + incoming + '</strong> 位新朋友';
        }
        return '这片小小的植物园，正等着第一位住客';
    }

    // 加载提醒数据
    var reminderMap = {};
    function loadReminders() {
        fetch('/api/codex/reminders')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var reminders = data.reminders || [];
                reminderMap = {};
                reminders.forEach(function(r) {
                    // 预设植物用 plant_lib_id，自定义植物用 name 作为 key
                    if (r.plant_lib_id) {
                        reminderMap[r.plant_lib_id] = r.days_since_last;
                    } else {
                        reminderMap[r.name] = r.days_since_last;
                    }
                });
                renderGrid();
            })
            .catch(function() {});
    }

    // 渲染卡片网格
    function renderGrid() {
        var filtered = currentCategory === 'all'
            ? allEntries
            : allEntries.filter(function(e) { return e.category === currentCategory; });

        if (filtered.length === 0) {
            codexGrid.style.display = 'none';
            codexEmpty.style.display = 'flex';
            return;
        }
        codexGrid.style.display = '';
        codexEmpty.style.display = 'none';

        var showDays = parseInt(localStorage.getItem('reminderShowDays')) || 5;
        var redDays = parseInt(localStorage.getItem('reminderRedDays')) || 10;
        var html = '';
        filtered.forEach(function(entry) {
            var lockedClass = entry.unlocked ? '' : ' locked';
            // 所有卡片都可点击：已解锁进入详情页，未解锁进入预览页
            // 自定义植物使用 /codex/custom/<unlock_id>，预设植物使用 /codex/preset/<plant_lib_id>
            var detailUrl = entry.is_custom
                ? ('/codex/custom/' + entry.id)
                : ('/codex/preset/' + entry.id);
            var clickAttr = ' onclick="location.href=\'' + detailUrl + '\'"';
            var categoryLabel = entry.category || (entry.is_custom ? '自定义' : '');
            html += '<div class="codex-card' + lockedClass + '"' + clickAttr + '>';
            if (categoryLabel) {
                html += '<div class="codex-card-category">' + escapeHtml(categoryLabel) + '</div>';
            }
            if (entry.unlocked) {
                // 星星标识（培育等级）
                var cl = entry.cultivation_level || 0;
                if (cl > 0) {
                    html += '<div class="codex-card-stars">';
                    for (var s = 0; s < 5; s++) {
                        html += '<span class="codex-card-star' + (s < cl ? '' : ' empty') + '">&#9733;</span>';
                    }
                    html += '</div>';
                }
                html += '<div class="codex-card-cover codex-card-cover-unlocked">' + getUnlockedCoverHtml(entry) + '</div>';
                html += '<div class="codex-card-name">' + escapeHtml(entry.name) + '</div>';
                if (entry.nickname) {
                    html += '<div class="codex-card-nickname">' + escapeHtml(entry.nickname) + '</div>';
                }
                html += '<div class="codex-card-stats">' + entry.record_count + '次记录 · ' + entry.care_days + '天</div>';
                if ((entry.todo_count || 0) + (entry.welcome_count || 0) > 0) {
                    var parts = [];
                    if (entry.todo_count) parts.push(entry.todo_count + '项待办');
                    if (entry.welcome_count) parts.push(entry.welcome_count + '位伙伴在路上');
                    html += '<div class="codex-card-plan-badge">' + parts.join(' · ') + '</div>';
                }
                // 提醒文字
                var daysSince = entry.is_custom ? reminderMap[entry.name] : reminderMap[entry.id];
                if (daysSince !== undefined && daysSince >= showDays) {
                    var overdueClass = daysSince >= redDays ? ' overdue' : '';
                    html += '<div class="codex-card-reminder' + overdueClass + '">你的植物想你了，已经' + daysSince + '天没去看它了</div>';
                }
            } else {
                html += '<div class="codex-card-silhouette">' + getLockedCoverHtml(entry) + '</div>';
                html += '<div class="codex-card-name">' + escapeHtml(entry.name) + '</div>';
                html += '<div class="codex-card-hint">尚未收录，等待一次命名记录</div>';
            }
            html += '</div>';
        });
        codexGrid.innerHTML = html;
    }

    // 分类筛选
    categoryTabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            categoryTabs.forEach(function(t) { t.classList.remove('active'); });
            this.classList.add('active');
            currentCategory = this.getAttribute('data-category');
            renderGrid();
        });
    });

    function getUnlockedCoverHtml(entry) {
        var artworkUrl = entry.artwork_url || entry.illustration_url || '';
        if (entry.cover_url) {
            return '<img class="codex-card-photo codex-card-user-cover" src="' + escapeHtml(entry.cover_url) + '" alt="' + escapeHtml(entry.name) + '">';
        }
        if (artworkUrl) {
            return '<img class="codex-card-artwork" src="' + escapeHtml(artworkUrl) + '" alt="' + escapeHtml(entry.name) + '">';
        }
        return '<div class="codex-card-placeholder">植物图鉴</div>';
    }

    function getLockedCoverHtml(entry) {
        var silhouetteUrl = entry.silhouette_url || '';
        var artworkUrl = entry.artwork_url || entry.illustration_url || '';
        if (silhouetteUrl) {
            return '<img class="codex-card-silhouette-img" src="' + escapeHtml(silhouetteUrl) + '" alt="' + escapeHtml(entry.name) + '">';
        }
        if (artworkUrl) {
            return '<img class="codex-card-silhouette-img codex-card-css-silhouette" src="' + escapeHtml(artworkUrl) + '" alt="' + escapeHtml(entry.name) + '">';
        }
        return '<span class="codex-card-unknown">?</span>';
    }

    function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    loadCodex();
})();
</script>
{% endblock %}
