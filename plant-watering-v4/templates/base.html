<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{% block title %}植物日志{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- 纸张纹理覆盖层 -->
    <div class="paper-texture"></div>

    <!-- 植物线描装饰 -->
    <svg class="plant-deco top-right" viewBox="0 0 80 120" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M40 120 Q40 80 20 60 Q10 50 15 35 Q20 20 35 25 Q50 30 45 45 Q40 60 30 55"/>
        <path d="M40 100 Q55 85 60 70 Q65 55 55 45"/>
        <path d="M35 90 Q20 80 15 70 Q10 60 20 55"/>
        <ellipse cx="25" cy="30" rx="8" ry="12"/>
        <ellipse cx="50" cy="50" rx="6" ry="9"/>
    </svg>
    <svg class="plant-deco bottom-left" viewBox="0 0 60 100" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M30 100 Q30 70 40 50 Q50 30 35 20"/>
        <path d="M30 80 Q15 70 10 55 Q5 40 20 35"/>
        <ellipse cx="35" cy="25" rx="10" ry="15"/>
        <ellipse cx="18" cy="40" rx="7" ry="10"/>
    </svg>

    <!-- 浮动叶片动画 -->
    <div class="droplets" id="droplets"></div>

    <!-- 手机框架 -->
    <div class="phone-frame">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span>植物日志</span>
            <span id="statusDate"></span>
        </div>

        {% block content %}{% endblock %}
    </div>

    <!-- 底部导航 -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item {% if request.endpoint == 'index' %}active{% endif %}">
            <span class="nav-icon">✏️</span>
            <span class="nav-label">记录</span>
        </a>
        <a href="/codex" class="nav-item {% if request.path.startswith('/codex') %}active{% endif %}">
            <span class="nav-icon">📖</span>
            <span class="nav-label">图鉴</span>
        </a>
        <a href="/records" class="nav-item {% if request.path.startswith('/records') or request.path.startswith('/board') %}active{% endif %}">
            <span class="nav-icon">📜</span>
            <span class="nav-label">档案</span>
        </a>
        <a href="javascript:void(0)" class="nav-item" onclick="openSettings()">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">设置</span>
        </a>
    </nav>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-icon">⚠</div>
            <h3 class="modal-title" id="modalTitle"></h3>
            <p class="modal-message" id="modalMessage"></p>
            <div class="modal-actions">
                <button class="modal-cancel" id="modalCancelBtn">取消</button>
                <button class="modal-confirm" id="modalConfirmBtn">确认</button>
            </div>
        </div>
    </div>

    <!-- 全屏照片查看器 -->
    <div class="viewer-overlay" id="viewerOverlay">
        <div class="viewer-header" id="viewerHeader">
            <button class="viewer-close" id="viewerClose">✕</button>
            <div class="viewer-header-actions">
                <button class="viewer-edit-tags" id="viewerEditTags" title="编辑标签">🏷️ 标签</button>
                <button class="viewer-edit-caption" id="viewerEditCaption" title="编辑注释">✏️ 注释</button>
            </div>
            <span class="viewer-counter" id="viewerCounter"></span>
        </div>
        <div class="viewer-body" id="viewerBody">
            <div class="viewer-track" id="viewerTrack"></div>
        </div>
        <div class="viewer-nav">
            <button class="viewer-arrow" id="viewerPrev">◀</button>
            <button class="viewer-arrow" id="viewerNext">▶</button>
        </div>
        <!-- 注释编辑弹层（全屏查看器内） -->
        <div class="viewer-caption-editor" id="viewerCaptionEditor" style="display:none;">
            <textarea id="viewerCaptionInput" placeholder="输入照片注释..." rows="2" maxlength="200"></textarea>
            <div class="viewer-caption-btns">
                <button onclick="saveViewerCaption()">保存</button>
                <button onclick="closeCaptionEditor()">取消</button>
            </div>
        </div>
        <!-- 照片查看器留言区域 -->
        <div class="viewer-comments" id="viewerComments">
            <div class="viewer-comments-list" id="viewerCommentsList">
                <!-- 动态渲染留言 -->
            </div>
            <div class="viewer-comment-input">
                <input type="text" id="commentAuthor" placeholder="你的名字" class="comment-author-input">
                <input type="text" id="commentContent" placeholder="写留言..." class="comment-content-input">
                <button class="comment-submit-btn" onclick="submitComment()">发送</button>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="settings-header">
                <h2>设置</h2>
                <button class="settings-close" id="settingsClose">✕</button>
            </div>
            <div class="settings-body">
                <a class="settings-item" href="/profile">
                    <span class="settings-item-icon">👤</span>
                    <span class="settings-item-text">我的档案</span>
                    <span class="settings-item-arrow">›</span>
                </a>
                <div class="settings-section">
                    <h3>排序方式</h3>
                    <p>记录列表的时间排列顺序</p>
                    <div class="settings-buttons">
                        <button class="btn-export sort-option active" data-order="desc" onclick="setSortOrder('desc')">从新到旧</button>
                        <button class="btn-export sort-option" data-order="asc" onclick="setSortOrder('asc')">从旧到新</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>植物提醒</h3>
                    <p>超过几天没记录时提醒，超过几天重点标红</p>
                    <div class="settings-thresholds">
                        <label>温柔提醒 <input type="number" id="reminderShowDaysInput" min="1" max="365" value="5"> 天</label>
                        <label>重点标红 <input type="number" id="reminderRedDaysInput" min="1" max="365" value="10"> 天</label>
                        <button class="btn-export" onclick="saveReminderSettings()">保存提醒设置</button>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>数据导出</h3>
                    <p>将浇水记录导出为文件保存到本地</p>
                    <div class="settings-buttons">
                        <a href="/export/excel" class="btn-export">导出 Excel</a>
                        <a href="/export/csv" class="btn-export">导出 CSV</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tag选择弹层 -->
    <div class="tag-picker-overlay" id="tagPickerOverlay" style="display:none;">
        <div class="tag-picker-panel">
            <div class="tag-picker-header">
                <h3>选择标签</h3>
                <button class="tag-picker-close" onclick="closeTagPicker()">&#x2715;</button>
            </div>
            <div class="tag-picker-search">
                <input type="text" id="tagSearchInput" placeholder="搜索或创建新标签" oninput="filterTags(this.value)">
            </div>
            <div class="tag-picker-tip">植物名标签会点亮图鉴；养护行为标签只用于记录；未知标签需确认后才会加入图鉴。</div>
            <div class="tag-picker-list" id="tagPickerList">
                <!-- 动态渲染 -->
            </div>
            <div class="tag-picker-create" id="tagPickerCreate" style="display:none;">
                <div class="tag-create-options">
                    <button id="tagCreatePlainBtn" onclick="createTagFromPicker('plain')">创建普通标签</button>
                    <select id="tagCreateCategory">
                        <option value="自定义">自定义</option>
                        <option value="观叶">观叶</option>
                        <option value="多肉">多肉</option>
                        <option value="花卉">花卉</option>
                        <option value="蔬果">蔬果</option>
                    </select>
                    <button id="tagCreatePlantBtn" onclick="createTagFromPicker('plant')">作为新植物收录</button>
                </div>
            </div>
            <div class="tag-picker-footer">
                <button class="tag-picker-confirm" onclick="confirmTagPicker()">确定</button>
            </div>
        </div>
    </div>

    <!-- GIF 制作面板 -->
    <div class="gif-maker-overlay" id="gifMakerOverlay" style="display:none;">
        <div class="gif-maker-panel">
            <div class="gif-maker-header">
                <h3>制作成长动画</h3>
                <button class="tag-picker-close" onclick="closeGifMaker()">&#x2715;</button>
            </div>
            <div class="gif-maker-body">
                <div class="gif-setting">
                    <label class="gif-setting-label">帧率 (FPS)</label>
                    <div class="gif-setting-options" id="gifFpsOptions">
                        <button class="gif-option" data-value="1">1</button>
                        <button class="gif-option active" data-value="2">2</button>
                        <button class="gif-option" data-value="3">3</button>
                        <button class="gif-option" data-value="5">5</button>
                        <button class="gif-option" data-value="8">8</button>
                    </div>
                </div>
                <div class="gif-setting">
                    <label class="gif-setting-label">输出尺寸</label>
                    <div class="gif-setting-options" id="gifSizeOptions">
                        <button class="gif-option" data-value="0">原始</button>
                        <button class="gif-option active" data-value="800">800px</button>
                        <button class="gif-option" data-value="600">600px</button>
                        <button class="gif-option" data-value="400">400px</button>
                    </div>
                </div>
                <div class="gif-setting">
                    <label class="gif-setting-label">播放顺序</label>
                    <div class="gif-setting-options" id="gifOrderOptions">
                        <button class="gif-option active" data-value="false">正序（从旧到新）</button>
                        <button class="gif-option" data-value="true">倒序（从新到旧）</button>
                    </div>
                </div>
                <div class="gif-preview-strip" id="gifPreviewStrip"></div>
                <button class="gif-generate-btn" id="gifGenerateBtn" onclick="generateGif()">生成动画</button>
                <div class="gif-progress" id="gifProgress" style="display:none;">
                    <div class="gif-progress-bar" id="gifProgressBar"></div>
                    <span class="gif-progress-text" id="gifProgressText">生成中...</span>
                </div>
                <div class="gif-result" id="gifResult" style="display:none;">
                    <img id="gifResultImg" src="" alt="GIF预览">
                    <div class="gif-result-info" id="gifResultInfo"></div>
                    <a class="gif-download-btn" id="gifDownloadBtn" href="" download>下载 GIF</a>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
    // 全局错误捕获（调试用）
    window.addEventListener('error', function(e) {
      console.error('[GLOBAL ERROR]', e.message, e.filename, e.lineno, e.colno);
    });

    // 状态栏日期显示
    (function() {
        var cnMonths = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二'];
        var now = new Date();
        var el = document.getElementById('statusDate');
        if (el) {
            el.textContent = '二零二六年' + cnMonths[now.getMonth()] + '月';
        }
    })();

    // GIF 制作面板参数选项切换
    document.querySelectorAll('.gif-setting-options').forEach(function(group) {
        group.addEventListener('click', function(e) {
            var btn = e.target.closest('.gif-option');
            if (!btn) return;
            group.querySelectorAll('.gif-option').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
        });
    });

    // GIF 制作面板打开/关闭/生成
    var gifSettings = { fps: 2, size: 800, reverse: false };

    window.openGifMaker = function() {
        if (typeof growthSelectedForGif === 'undefined' || growthSelectedForGif.size < 3) {
            if (typeof showToast === 'function') showToast('请至少选择3张照片', 'error');
            return;
        }
        // 渲染已选照片预览
        var strip = document.getElementById('gifPreviewStrip');
        strip.innerHTML = '';
        var cards = document.querySelectorAll('.growth-card');
        cards.forEach(function(card) {
            var id = parseInt(card.getAttribute('data-photo-id'));
            if (growthSelectedForGif.has(id)) {
                var img = card.querySelector('.growth-card-photo img');
                if (img) {
                    var thumb = document.createElement('img');
                    thumb.className = 'gif-preview-thumb';
                    thumb.src = img.src;
                    strip.appendChild(thumb);
                }
            }
        });
        // 读取参数
        gifSettings.fps = parseInt(document.querySelector('#gifFpsOptions .gif-option.active').getAttribute('data-value')) || 2;
        gifSettings.size = parseInt(document.querySelector('#gifSizeOptions .gif-option.active').getAttribute('data-value')) || 800;
        gifSettings.reverse = document.querySelector('#gifOrderOptions .gif-option.active').getAttribute('data-value') === 'true';

        var overlay = document.getElementById('gifMakerOverlay');
        overlay.style.display = 'flex';
        overlay.classList.add('show');
        document.body.style.overflow = 'hidden';
        document.getElementById('gifResult').style.display = 'none';
        document.getElementById('gifProgress').style.display = 'none';
        document.getElementById('gifGenerateBtn').disabled = false;
        document.getElementById('gifGenerateBtn').textContent = '生成动画';
    };

    window.closeGifMaker = function() {
        var overlay = document.getElementById('gifMakerOverlay');
        overlay.style.display = 'none';
        overlay.classList.remove('show');
        document.body.style.overflow = '';
    };

    window.generateGif = function() {
        gifSettings.fps = parseInt(document.querySelector('#gifFpsOptions .gif-option.active').getAttribute('data-value')) || 2;
        gifSettings.size = parseInt(document.querySelector('#gifSizeOptions .gif-option.active').getAttribute('data-value')) || 800;
        gifSettings.reverse = document.querySelector('#gifOrderOptions .gif-option.active').getAttribute('data-value') === 'true';

        var photoIds = Array.from(growthSelectedForGif);
        var btn = document.getElementById('gifGenerateBtn');
        btn.disabled = true;
        btn.textContent = '生成中...';

        var progress = document.getElementById('gifProgress');
        progress.style.display = 'block';
        var bar = document.getElementById('gifProgressBar');
        bar.style.width = '0%';
        // 模拟进度
        var progressVal = 0;
        var interval = setInterval(function() {
            progressVal = Math.min(progressVal + Math.random() * 15, 90);
            bar.style.width = progressVal + '%';
        }, 300);

        fetch('/api/gif/create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                photo_ids: photoIds,
                fps: gifSettings.fps,
                size: gifSettings.size,
                reverse: gifSettings.reverse
            })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            clearInterval(interval);
            bar.style.width = '100%';
            setTimeout(function() {
                progress.style.display = 'none';
                if (data.success) {
                    var result = document.getElementById('gifResult');
                    result.style.display = 'block';
                    document.getElementById('gifResultImg').src = data.gif_url;
                    document.getElementById('gifResultInfo').textContent =
                        data.frame_count + '帧 / ' + data.file_size + ' / ' +
                        (data.duration_ms / 1000).toFixed(1) + '秒';
                    document.getElementById('gifDownloadBtn').href = data.gif_url;
                    document.getElementById('gifDownloadBtn').download = 'growth_' + Date.now() + '.gif';
                    if (typeof showToast === 'function') showToast('GIF 生成成功');
                } else {
                    if (typeof showToast === 'function') showToast(data.error || '生成失败', 'error');
                }
            }, 300);
        })
        .catch(function() {
            clearInterval(interval);
            progress.style.display = 'none';
            if (typeof showToast === 'function') showToast('网络错误', 'error');
        })
        .finally(function() {
            btn.disabled = false;
            btn.textContent = '生成动画';
        });
    };
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
