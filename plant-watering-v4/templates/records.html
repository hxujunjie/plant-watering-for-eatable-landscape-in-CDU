{% extends "base.html" %}

{% block title %}观察档案{% endblock %}

{% block content %}
<!-- 页面头部 - 植物志封面风格 -->
<div class="header header-compact">
    <div class="header-badge">ARCHIVE</div>
    <h1>观察档案</h1>
    <div class="header-divider">
        <div class="line"></div>
        <div class="leaf">📖</div>
        <div class="line"></div>
    </div>
</div>

<!-- 标签页切换 -->
<div class="tabs scrollable">
    <button class="tab active" data-tab="list">记录列表</button>
    <button class="tab" data-tab="calendar">日历</button>
    <button class="tab" data-tab="board">黑板</button>
    <button class="tab" data-tab="tags">标签筛选</button>
</div>

<!-- 签到列表 -->
<div class="tab-content active" id="tabList">
    <div id="recordsList"></div>
    <div class="empty-state" id="listEmpty">
        <div class="empty-icon">🌿</div>
        <div class="empty-title">这片土壤还在等待第一颗种子</div>
        <div class="empty-desc">去记录你的植物，它们就会出现在这里</div>
    </div>
    <div class="load-more-wrapper" id="loadMoreWrapper">
        <button class="btn-load-more" id="loadMoreBtn">翻翻过去的日记...</button>
    </div>
</div>

<!-- 日历视图 -->
<div class="tab-content" id="tabCalendar">
    <div class="calendar-nav">
        <button class="cal-nav-btn" id="calPrev">&lt;</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button class="cal-nav-btn" id="calNext">&gt;</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="cal-detail" id="calDetail"></div>
    <div class="empty-state" id="calendarEmpty">
        <div class="empty-icon">📅</div>
        <div class="empty-title">这片土壤还在等待第一颗种子</div>
        <div class="empty-desc">浇水后这里会显示标记</div>
    </div>
</div>

<!-- 黑板留言 -->
<div class="tab-content" id="tabBoard">
    <!-- 搜索栏 -->
    <div class="board-search">
        <input type="text" id="boardSearchInput" placeholder="搜索留言..." maxlength="50">
    </div>

    <!-- 便利贴墙 -->
    <div class="board-wall" id="boardWall">
        <!-- 便利贴由JS动态渲染 -->
    </div>

    <!-- 加载更多 -->
    <div class="board-load-more" id="boardLoadMore" style="display:none;">
        <button id="boardLoadMoreBtn" class="board-load-more-btn">翻翻过去的日记...</button>
    </div>

    <!-- 空状态提示 -->
    <div class="board-empty" id="boardEmpty" style="display:none;">
        <div class="empty-icon">📝</div>
        <div class="empty-title">黑板还是空的，来留下第一笔吧</div>
        <div class="empty-desc">在黑板上写下你的植物心得</div>
    </div>

    <!-- 输入区域 -->
    <div class="board-input">
        <div class="board-input-card">
            <input type="text" id="boardAuthor" class="board-author-input" placeholder="你的名字" maxlength="20">
            <textarea id="boardContent" class="board-content-input" placeholder="写下你的留言..." rows="2" maxlength="200"></textarea>
            <div class="board-input-footer">
                <div class="board-colors" id="boardColors">
                    <!-- 颜色选择按钮由JS渲染 -->
                </div>
                <button class="board-submit" id="boardSubmitBtn">发布留言</button>
            </div>
        </div>
    </div>
</div>

<!-- 便利贴放大遮罩 -->
<div class="note-overlay" id="noteOverlay">
    <div class="note-zoomed" id="noteZoomed">
        <button class="note-zoomed-close" id="noteZoomedClose">&times;</button>
        <div class="note-zoomed-content" id="noteZoomedContent"></div>
    </div>
</div>

<!-- 标签筛选 -->
<div class="tab-content" id="tabTags">
    <div class="tags-cloud" id="tagsCloud">
        <!-- 动态渲染tag列表 -->
    </div>
    <div class="tag-filter-result" id="tagFilterResult">
        <!-- 点击tag后显示照片合集 -->
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
// ========== 竖排中文数字 ==========
    var cnNumbers = ['壹', '贰', '叁', '肆', '伍', '陆', '柒', '捌', '玖', '拾',
                     '拾壹', '拾贰', '拾叁', '拾肆', '拾伍', '拾陆', '拾柒', '拾捌', '拾玖', '贰拾'];
    var recordCounter = 0;

    function getCnNumber(index) {
        if (index < cnNumbers.length) return cnNumbers[index];
        return String(index + 1);
    }

    // ========== 状态变量 ==========
    var currentPage = 1;
    var hasMore = true;
    var listLoaded = false;
    var calendarLoaded = false;
    var boardLoaded = false;
    var tagsLoaded = false;
    var calYear, calMonth;

    // ========== Tab 切换逻辑 ==========
    var tabs = document.querySelectorAll('.tab');
    var tabContents = document.querySelectorAll('.tab-content');

    tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            var targetTab = this.getAttribute('data-tab');

            // 切换 tab 样式
            tabs.forEach(function(t) { t.classList.remove('active'); });
            this.classList.add('active');

            // 切换内容区域
            tabContents.forEach(function(tc) { tc.classList.remove('active'); });
            document.getElementById('tab' + targetTab.charAt(0).toUpperCase() + targetTab.slice(1)).classList.add('active');

            // 按需加载数据
            if (targetTab === 'list' && !listLoaded) {
                loadRecords(false);
            } else if (targetTab === 'calendar' && !calendarLoaded) {
                calendarLoaded = true;
                initCalendar();
                loadCalendar();
            } else if (targetTab === 'board' && !boardLoaded) {
                boardLoaded = true;
                initBoard();
            } else if (targetTab === 'tags' && !tagsLoaded) {
                loadTagsCloud();
            }
        });
    });

    // ========== 签到列表 ==========
    function loadRecords(append) {
        var recordsList = document.getElementById('recordsList');
        var listEmpty = document.getElementById('listEmpty');
        var loadMoreWrapper = document.getElementById('loadMoreWrapper');
        var loadMoreBtn = document.getElementById('loadMoreBtn');

        if (!append) {
            currentPage = 1;
            hasMore = true;
            recordsList.innerHTML = '';
            recordCounter = 0;
        }

        loadMoreBtn.disabled = true;
        loadMoreBtn.textContent = '加载中...';

        fetch('/api/logs?page=' + currentPage + '&order=' + (typeof getSortOrder === 'function' ? getSortOrder() : 'desc'))
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var logs = data.logs || [];
                if (logs.length === 0 && !append) {
                    listEmpty.style.display = '';
                    loadMoreWrapper.style.display = 'none';
                } else {
                    listEmpty.style.display = 'none';
                    logs.forEach(function(log) {
                        recordsList.appendChild(renderRecordItem(log));
                    });
                    bindRecordEvents();
                    if (logs.length < 20) {
                        hasMore = false;
                        loadMoreWrapper.style.display = 'none';
                    } else {
                        loadMoreWrapper.style.display = '';
                    }
                }
                listLoaded = true;
            })
            .catch(function() {
                showToast('加载记录失败');
            })
            .finally(function() {
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = '翻翻过去的日记...';
            });
    }

    function renderRecordItem(log) {
        var item = document.createElement('div');
        item.className = 'record-item';
        item.setAttribute('data-id', log.id);

        // 竖排中文编号
        var indexEl = document.createElement('div');
        indexEl.className = 'record-index-cn';
        indexEl.textContent = getCnNumber(recordCounter);
        recordCounter++;

        // 头像：取名字首字
        var avatar = document.createElement('div');
        avatar.className = 'record-avatar';
        avatar.textContent = log.name ? log.name.charAt(0) : '?';

        // 内容区
        var content = document.createElement('div');
        content.className = 'record-info';

        var nameSpan = document.createElement('span');
        nameSpan.className = 'record-name';
        nameSpan.textContent = log.name || '未知';

        var timeSpan = document.createElement('span');
        timeSpan.className = 'record-time';
        timeSpan.textContent = formatTime(log.created_at);

        content.appendChild(nameSpan);
        content.appendChild(timeSpan);
        if (log.note) {
            var noteEl = document.createElement('div');
            noteEl.className = 'record-note';
            noteEl.textContent = log.note;
            content.appendChild(noteEl);
        }

        // 照片缩略图
        if (log.photos && log.photos.length > 0) {
            var thumbs = document.createElement('div');
            thumbs.className = 'record-photos';
            log.photos.forEach(function(photo) {
                var thumbWrap = document.createElement('div');
                thumbWrap.className = 'record-thumb-wrap';
                thumbWrap.style.position = 'relative';

                var img = document.createElement('img');
                img.className = 'record-thumb';
                img.src = photo.file_path || photo.path;
                img.alt = '照片';
                img.loading = 'lazy';
                // 将 photo id 存储到 data 属性，用于留言加载
                if (photo.id) {
                    img.setAttribute('data-photo-id', photo.id);
                }
                img.addEventListener('click', function() {
                    openViewer(img);
                });
                thumbWrap.appendChild(img);

                // 叠加注释文字
                if (photo.caption) {
                    var captionEl = document.createElement('div');
                    captionEl.className = 'photo-caption-overlay';
                    captionEl.textContent = photo.caption;
                    thumbWrap.appendChild(captionEl);
                }

                // 叠加tag小标签
                if (photo.tags && photo.tags.length > 0) {
                    var tagOverlay = document.createElement('div');
                    tagOverlay.className = 'photo-tag-overlay';
                    photo.tags.forEach(function(tag) {
                        var badge = document.createElement('span');
                        badge.className = 'photo-tag-badge';
                        badge.textContent = tag.name || tag;
                        tagOverlay.appendChild(badge);
                    });
                    thumbWrap.appendChild(tagOverlay);
                }

                // 照片留言预览（显示留言数和最新一条留言）
                if (photo.id) {
                    var commentPreview = document.createElement('div');
                    commentPreview.className = 'photo-comment-preview';
                    commentPreview.setAttribute('data-photo-id', photo.id);
                    // 先显示加载占位
                    commentPreview.innerHTML = '<span class="photo-comment-loading">...</span>';
                    thumbs.appendChild(thumbWrap);
                    thumbs.appendChild(commentPreview);
                    // 异步加载留言预览
                    loadPhotoCommentPreview(photo.id, commentPreview);
                } else {
                    thumbs.appendChild(thumbWrap);
                }
            });
            content.appendChild(thumbs);
        }

        // 点赞按钮
        var likeDiv = document.createElement('div');
        likeDiv.className = 'record-like';
        var likeBtn = document.createElement('button');
        likeBtn.className = 'like-btn';
        likeBtn.setAttribute('data-log-id', log.id);
        likeBtn.innerHTML = '<span class="like-icon">🤍</span><span class="like-count">' + (log.like_count || 0) + '</span>';
        likeBtn.addEventListener('click', function() {
            toggleLike(log.id, this);
        });
        likeDiv.appendChild(likeBtn);

        // 撤销按钮 - 文字"作废"
        var undoBtn = document.createElement('button');
        undoBtn.className = 'btn-undo';
        undoBtn.textContent = '作废';
        undoBtn.setAttribute('data-id', log.id);

        item.appendChild(indexEl);
        item.appendChild(avatar);
        item.appendChild(content);
        item.appendChild(likeDiv);
        item.appendChild(undoBtn);

        return item;
    }

    function formatTime(timeStr) {
        if (!timeStr) return '';
        var d = new Date(timeStr.replace(/-/g, '/'));
        var now = new Date();
        var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        var diffDays = Math.floor((today - target) / (1000 * 60 * 60 * 24));

        var hh = String(d.getHours()).padStart(2, '0');
        var mm = String(d.getMinutes()).padStart(2, '0');
        var timePart = hh + ':' + mm;

        if (diffDays === 0) return '今日 ' + timePart;
        if (diffDays === 1) return '昨日 ' + timePart;
        if (diffDays === 2) return '前日 ' + timePart;

        var month = d.getMonth() + 1;
        var day = d.getDate();
        if (d.getFullYear() === now.getFullYear()) {
            return month + '月' + day + '日 ' + timePart;
        }
        return d.getFullYear() + '/' + month + '/' + day + ' ' + timePart;
    }

    function bindRecordEvents() {
        var undoBtns = document.querySelectorAll('.btn-undo');
        undoBtns.forEach(function(btn) {
            // 避免重复绑定
            if (btn.getAttribute('data-bound')) return;
            btn.setAttribute('data-bound', '1');

            btn.addEventListener('click', function() {
                var id = this.getAttribute('data-id');
                showModal('确认作废这条记录？', '这会删除本条记录、关联照片、照片标签和留言；如果它是某株植物唯一的记录，图鉴解锁状态也可能变化。此操作不能撤回。', function() {
                    fetch('/api/delete/' + id, { method: 'DELETE' })
                        .then(function(res) { return res.json(); })
                        .then(function(data) {
                            if (data.success) {
                                showToast('已作废');
                                var item = document.querySelector('.record-item[data-id="' + id + '"]');
                                if (item) {
                                    item.style.transition = 'all 0.3s ease';
                                    item.style.opacity = '0';
                                    item.style.transform = 'translateX(100%)';
                                    item.style.maxHeight = item.scrollHeight + 'px';
                                    setTimeout(function() {
                                        item.style.maxHeight = '0';
                                        item.style.padding = '0';
                                        item.style.margin = '0';
                                    }, 300);
                                    setTimeout(function() {
                                        item.remove();
                                        // 检查列表是否为空
                                        var recordsList = document.getElementById('recordsList');
                                        if (recordsList.children.length === 0) {
                                            document.getElementById('listEmpty').style.display = '';
                                            document.getElementById('loadMoreWrapper').style.display = 'none';
                                        }
                                    }, 600);
                                }
                            } else {
                                showToast(data.message || '操作失败');
                            }
                        })
                        .catch(function() {
                            showToast('网络错误，请重试');
                        });
                });
            });
        });
    }

    // 加载更多按钮
    document.getElementById('loadMoreBtn').addEventListener('click', function() {
        if (hasMore) {
            currentPage++;
            loadRecords(true);
        }
    });

    // ========== 日历视图 ==========
    function initCalendar() {
        var now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth() + 1;
        updateCalLabel();
    }

    function updateCalLabel() {
        document.getElementById('calMonthLabel').textContent = calYear + '年' + calMonth + '月';
    }

    function loadCalendar() {
        var calendarGrid = document.getElementById('calendarGrid');
        var calendarEmpty = document.getElementById('calendarEmpty');
        var calDetail = document.getElementById('calDetail');
        calDetail.innerHTML = '';

        fetch('/api/calendar?year=' + calYear + '&month=' + calMonth)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var dates = data.dates || [];
                renderCalendar(dates);
                if (dates.length === 0) {
                    calendarEmpty.style.display = '';
                } else {
                    calendarEmpty.style.display = 'none';
                }
            })
            .catch(function() {
                showToast('加载日历失败');
            });
    }

    function renderCalendar(markedDates) {
        var grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        // 星期标题行
        var weekHeaders = ['日', '一', '二', '三', '四', '五', '六'];
        weekHeaders.forEach(function(w) {
            var cell = document.createElement('div');
            cell.className = 'cal-header';
            cell.textContent = w;
            grid.appendChild(cell);
        });

        // 计算本月第一天星期几和天数
        var firstDay = new Date(calYear, calMonth - 1, 1).getDay();
        var daysInMonth = new Date(calYear, calMonth, 0).getDate();
        var today = new Date();
        var todayYear = today.getFullYear();
        var todayMonth = today.getMonth() + 1;
        var todayDate = today.getDate();

        // 标记日期集合（用于快速查找）
        var markedSet = {};
        markedDates.forEach(function(d) {
            // d 可能是 "2026-06-10" 格式，提取日号
            var parts = d.split('-');
            var dayNum = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(d, 10);
            markedSet[dayNum] = true;
        });

        // 前面的空白格
        for (var i = 0; i < firstDay; i++) {
            var empty = document.createElement('div');
            empty.className = 'cal-day empty';
            grid.appendChild(empty);
        }

        // 日期格
        for (var day = 1; day <= daysInMonth; day++) {
            var cell = document.createElement('div');
            cell.className = 'cal-day';
            cell.textContent = day;

            if (markedSet[day]) {
                cell.classList.add('marked');
            }
            if (calYear === todayYear && calMonth === todayMonth && day === todayDate) {
                cell.classList.add('today');
            }

            // 绑定点击加载详情
            (function(d) {
                cell.addEventListener('click', function() {
                    // 高亮选中
                    grid.querySelectorAll('.cal-day').forEach(function(c) {
                        c.classList.remove('selected');
                    });
                    this.classList.add('selected');
                    loadCalendarDetail(d);
                });
            })(day);

            grid.appendChild(cell);
        }
    }

    function loadCalendarDetail(day) {
        var calDetail = document.getElementById('calDetail');
        calDetail.innerHTML = '<div class="cal-detail-loading">加载中...</div>';
        calDetail.classList.add('show');

        fetch('/api/calendar/detail?year=' + calYear + '&month=' + calMonth + '&day=' + day)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var logs = data.logs || [];
                if (logs.length === 0) {
                    calDetail.innerHTML = '<div class="cal-detail-empty">这片土壤还在等待第一颗种子</div>';
                    return;
                }
                calDetail.innerHTML = '';
                logs.forEach(function(log) {
                    var item = document.createElement('div');
                    item.className = 'cal-detail-item';

                    var avatar = document.createElement('div');
                    avatar.className = 'cal-detail-avatar';
                    avatar.textContent = log.name ? log.name.charAt(0) : '?';

                    var info = document.createElement('div');
                    info.className = 'cal-detail-info';

                    var nameSpan = document.createElement('span');
                    nameSpan.className = 'cal-detail-name';
                    nameSpan.textContent = log.name || '未知';

                    var timeSpan = document.createElement('span');
                    timeSpan.className = 'cal-detail-time';
                    timeSpan.textContent = log.created_at ? log.created_at.split(' ')[1] || '' : '';

                    info.appendChild(nameSpan);
                    info.appendChild(timeSpan);
                    if (log.note) {
                        var noteEl = document.createElement('div');
                        noteEl.className = 'cal-detail-note';
                        noteEl.textContent = log.note;
                        info.appendChild(noteEl);
                    }

                    // 照片缩略图
                    if (log.photos && log.photos.length > 0) {
                        var thumbs = document.createElement('div');
                        thumbs.className = 'cal-detail-thumbs';
                        log.photos.forEach(function(photo) {
                            var img = document.createElement('img');
                            img.className = 'cal-detail-thumb';
                            img.src = photo.file_path || photo.path;
                            img.alt = '照片';
                            img.loading = 'lazy';
                            img.addEventListener('click', function() {
                                openViewer(img);
                            });
                            thumbs.appendChild(img);
                        });
                        info.appendChild(thumbs);
                    }

                    item.appendChild(avatar);
                    item.appendChild(info);
                    calDetail.appendChild(item);
                });
            })
            .catch(function() {
                calDetail.innerHTML = '<div class="cal-detail-empty">加载失败</div>';
            });
    }

    // 日历月份切换
    document.getElementById('calPrev').addEventListener('click', function() {
        calMonth--;
        if (calMonth < 1) {
            calMonth = 12;
            calYear--;
        }
        updateCalLabel();
        loadCalendar();
    });

    document.getElementById('calNext').addEventListener('click', function() {
        calMonth++;
        if (calMonth > 12) {
            calMonth = 1;
            calYear++;
        }
        updateCalLabel();
        loadCalendar();
    });

    // ========== 标签筛选Tab ==========
    var allTagsCache = [];
    var activeTagIds = [];

    function loadTagsCloud() {
        var tagsCloud = document.getElementById('tagsCloud');
        tagsCloud.innerHTML = '<div style="text-align:center;padding:1rem;color:var(--pencil);font-size:0.85rem;">加载中...</div>';

        fetch('/api/tags')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                allTagsCache = data.tags || [];
                renderTagsCloud();
                tagsLoaded = true;
            })
            .catch(function() {
                tagsCloud.innerHTML = '<div style="text-align:center;padding:1rem;color:var(--accent-rose);font-size:0.85rem;">加载标签失败</div>';
            });
    }

    function renderTagsCloud() {
        var tagsCloud = document.getElementById('tagsCloud');
        tagsCloud.innerHTML = '';

        if (allTagsCache.length === 0) {
            tagsCloud.innerHTML = '<div class="empty-state" style="padding:2rem 1rem;"><div class="empty-title">这片土壤还在等待第一颗种子</div><div class="empty-desc">签到时为照片添加标签，此处将展示</div></div>';
            return;
        }

        allTagsCache.forEach(function(tag) {
            var item = document.createElement('button');
            item.type = 'button';
            var isActive = activeTagIds.indexOf(tag.id) !== -1;
            item.className = 'tag-cloud-item' + (isActive ? ' active' : '');
            item.setAttribute('data-id', tag.id);
            item.innerHTML = '<span class="tag-cloud-name">' + escapeHtml(tag.name) + '</span>' +
                (tag.count !== undefined ? '<span class="tag-cloud-count">' + tag.count + '</span>' : '');
            item.addEventListener('click', function() {
                var idx = activeTagIds.indexOf(tag.id);
                if (idx !== -1) {
                    // 取消选中
                    activeTagIds.splice(idx, 1);
                } else {
                    // 添加选中
                    activeTagIds.push(tag.id);
                }
                renderTagsCloud();
                // 如果有选中的标签，执行筛选
                if (activeTagIds.length > 0) {
                    loadTagFilterResult();
                } else {
                    document.getElementById('tagFilterResult').innerHTML = '';
                }
            });
            tagsCloud.appendChild(item);
        });
    }

    function loadTagFilterResult() {
        var resultDiv = document.getElementById('tagFilterResult');
        resultDiv.innerHTML = '<div style="text-align:center;padding:1rem;color:var(--pencil);font-size:0.85rem;">筛选中...</div>';

        // 构建选中标签名称
        var tagNames = [];
        allTagsCache.forEach(function(t) {
            if (activeTagIds.indexOf(t.id) !== -1) tagNames.push(t.name);
        });

        var url = '/api/photos/by-tags?tag_ids=' + activeTagIds.join(',') + '&order=' + (typeof getSortOrder === 'function' ? getSortOrder() : 'desc');

        fetch(url)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var photos = data.photos || [];
                resultDiv.innerHTML = '';

                if (photos.length === 0) {
                    resultDiv.innerHTML = '<div style="text-align:center;padding:1.5rem;color:var(--pencil);font-size:0.85rem;">没有同时包含 ' + tagNames.join(' + ') + ' 的照片</div>';
                    return;
                }

                // 标题
                var title = document.createElement('div');
                title.className = 'photo-date';
                title.textContent = tagNames.join(' + ') + ' (' + photos.length + '张照片)';
                resultDiv.appendChild(title);

                // 照片网格
                var grid = document.createElement('div');
                grid.className = 'photo-grid';

                photos.forEach(function(photo) {
                    var item = document.createElement('div');
                    item.className = 'photo-item';
                    var img = document.createElement('img');
                    img.src = photo.file_path || photo.path;
                    img.alt = '照片';
                    img.loading = 'lazy';
                    if (photo.id) img.setAttribute('data-photo-id', photo.id);
                    img.addEventListener('click', function() {
                        openViewerUrl(img);
                    });
                    item.appendChild(img);

                    // 叠加注释
                    if (photo.caption) {
                        var captionEl = document.createElement('div');
                        captionEl.className = 'photo-caption-overlay';
                        captionEl.textContent = photo.caption;
                        item.appendChild(captionEl);
                    }

                    // 叠加tag
                    if (photo.tags && photo.tags.length > 0) {
                        var tagOverlay = document.createElement('div');
                        tagOverlay.className = 'photo-tag-overlay';
                        photo.tags.forEach(function(t) {
                            var badge = document.createElement('span');
                            badge.className = 'photo-tag-badge';
                            badge.textContent = t.name || t;
                            tagOverlay.appendChild(badge);
                        });
                        item.appendChild(tagOverlay);
                    }

                    grid.appendChild(item);
                });

                resultDiv.appendChild(grid);
            })
            .catch(function() {
                resultDiv.innerHTML = '<div style="text-align:center;padding:1rem;color:var(--accent-rose);font-size:0.85rem;">加载失败</div>';
            });
    }

    // HTML转义工具函数
    function escapeHtml(str) {
        if (!str) return '';
        var div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // 全局 switchTab 函数（供标签筛选Tab按钮的 onclick 调用）
    window.switchTab = function(targetTab) {
        // 切换 tab 样式
        tabs.forEach(function(t) { t.classList.remove('active'); });
        var targetBtn = document.querySelector('.tab[data-tab="' + targetTab + '"]');
        if (targetBtn) targetBtn.classList.add('active');

        // 切换内容区域
        tabContents.forEach(function(tc) { tc.classList.remove('active'); });
        var targetContent = document.getElementById('tab' + targetTab.charAt(0).toUpperCase() + targetTab.slice(1));
        if (targetContent) targetContent.classList.add('active');

        // 按需加载数据
        if (targetTab === 'list' && !listLoaded) {
            loadRecords(false);
        } else if (targetTab === 'calendar' && !calendarLoaded) {
            calendarLoaded = true;
            initCalendar();
            loadCalendar();
        } else if (targetTab === 'board' && !boardLoaded) {
            boardLoaded = true;
            initBoard();
        } else if (targetTab === 'tags' && !tagsLoaded) {
            loadTagsCloud();
        }
    };

    // ========== 点赞功能 ==========
    // 切换点赞状态
    window.toggleLike = function(logId, btn) {
        var author = localStorage.getItem('board_author') || '匿名';
        var isLiked = btn.classList.contains('liked');

        if (isLiked) {
            // 取消点赞
            fetch('/api/logs/' + logId + '/like', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({author: author})
            }).then(function(r) { return r.json(); }).then(function(data) {
                btn.classList.remove('liked');
                btn.querySelector('.like-icon').textContent = '🤍';
                btn.querySelector('.like-count').textContent = data.like_count || 0;
            }).catch(function() {
                showToast('操作失败');
            });
        } else {
            // 点赞
            fetch('/api/logs/' + logId + '/like', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({author: author})
            }).then(function(r) { return r.json(); }).then(function(data) {
                btn.classList.add('liked');
                btn.querySelector('.like-icon').textContent = '❤️';
                btn.querySelector('.like-count').textContent = data.like_count || 1;
            }).catch(function() {
                showToast('操作失败');
            });
        }
    };

    // ========== 照片留言功能 ==========
    // 当前正在查看的照片ID
    var currentViewingPhotoId = null;

    // 加载照片留言预览（记录列表中每张照片下方显示留言数和最新留言）
    function loadPhotoCommentPreview(photoId, containerEl) {
        fetch('/api/photos/' + photoId + '/comments')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var comments = data.comments || [];
                if (comments.length === 0) {
                    // 无留言时隐藏预览区域
                    containerEl.style.display = 'none';
                    return;
                }
                containerEl.style.display = '';
                var latest = comments[comments.length - 1];
                var previewHtml = '<span class="photo-comment-count">' + comments.length + '条留言</span>';
                previewHtml += ' <span class="photo-comment-latest">' + escapeHtml(latest.author) + '：' + escapeHtml(latest.content) + '</span>';
                containerEl.innerHTML = previewHtml;
            })
            .catch(function() {
                // 加载失败时隐藏
                containerEl.style.display = 'none';
            });
    }

    // 加载照片留言（全屏查看器中）
    window.loadPhotoComments = function(photoId) {
        currentViewingPhotoId = photoId;
        var commentsList = document.getElementById('viewerCommentsList');
        if (commentsList) {
            commentsList.innerHTML = '<div class="viewer-comments-loading">加载留言中...</div>';
        }
        fetch('/api/photos/' + photoId + '/comments')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                renderComments(data.comments || []);
            })
            .catch(function() {
                if (commentsList) {
                    commentsList.innerHTML = '<div class="viewer-comments-empty">加载留言失败</div>';
                }
            });
    };

    // 提交留言
    window.submitComment = function() {
        var authorInput = document.getElementById('commentAuthor');
        var contentInput = document.getElementById('commentContent');
        var author = authorInput ? (authorInput.value.trim() || '匿名') : '匿名';
        var content = contentInput ? contentInput.value.trim() : '';
        if (!content || !currentViewingPhotoId) return;

        fetch('/api/photos/' + currentViewingPhotoId + '/comments', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({author: author, content: content})
        }).then(function(r) { return r.json(); }).then(function(data) {
            if (contentInput) contentInput.value = '';
            localStorage.setItem('board_author', author);
            loadPhotoComments(currentViewingPhotoId);
        }).catch(function() {
            showToast('留言发送失败');
        });
    };

    // 渲染留言列表
    function renderComments(comments) {
        var commentsList = document.getElementById('viewerCommentsList');
        if (!commentsList) return;

        if (comments.length === 0) {
            commentsList.innerHTML = '<div class="viewer-comments-empty">黑板还是空的，来留下第一笔吧</div>';
            return;
        }

        commentsList.innerHTML = '';
        comments.forEach(function(comment) {
            var item = document.createElement('div');
            item.className = 'viewer-comment-item';

            var authorSpan = document.createElement('span');
            authorSpan.className = 'viewer-comment-author';
            authorSpan.textContent = comment.author || '匿名';

            var contentSpan = document.createElement('span');
            contentSpan.className = 'viewer-comment-text';
            contentSpan.textContent = comment.content;

            var timeSpan = document.createElement('span');
            timeSpan.className = 'viewer-comment-time';
            timeSpan.textContent = comment.created_at ? formatCommentTime(comment.created_at) : '';

            item.appendChild(authorSpan);
            item.appendChild(contentSpan);
            item.appendChild(timeSpan);
            commentsList.appendChild(item);
        });

        // 滚动到最新留言
        commentsList.scrollTop = commentsList.scrollHeight;
    }

    // 格式化留言时间（简易版）
    function formatCommentTime(timeStr) {
        if (!timeStr) return '';
        var d = new Date(timeStr.replace(/-/g, '/'));
        var month = d.getMonth() + 1;
        var day = d.getDate();
        var hh = String(d.getHours()).padStart(2, '0');
        var mm = String(d.getMinutes()).padStart(2, '0');
        return month + '/' + day + ' ' + hh + ':' + mm;
    }

    // ========== 增强 openViewer：打开查看器时加载留言 ==========
    // 保存原始 openViewer 函数引用
    var _originalOpenViewer = window.openViewer;
    var _originalOpenViewerUrl = window.openViewerUrl;

    // 重写 openViewer，在打开后加载当前照片的留言
    window.openViewer = function(imgElement) {
        _originalOpenViewer(imgElement);
        // 延迟一帧确保 viewer 已渲染
        requestAnimationFrame(function() {
            loadViewerCommentsForCurrentSlide();
        });
    };

    // 重写 openViewerUrl
    window.openViewerUrl = function(url) {
        _originalOpenViewerUrl(url);
        requestAnimationFrame(function() {
            loadViewerCommentsForCurrentSlide();
        });
    };

    // 根据当前查看器中显示的照片加载留言
    function loadViewerCommentsForCurrentSlide() {
        // 查找当前 slide 中图片的 data-photo-id
        var slides = document.querySelectorAll('.viewer-slide');
        var currentSlide = slides[viewerIndex]; // viewerIndex 在 main.js 中定义
        if (!currentSlide) return;

        var img = currentSlide.querySelector('img');
        if (!img) return;

        // 尝试从原始 DOM 中找到对应的 photo id
        var photoId = img.getAttribute('data-photo-id');
        if (!photoId) {
            // 通过图片 src 在页面中查找原始缩略图的 photo id
            var src = img.getAttribute('src');
            var allThumbs = document.querySelectorAll('img[data-photo-id]');
            for (var i = 0; i < allThumbs.length; i++) {
                if (allThumbs[i].getAttribute('src') === src) {
                    photoId = allThumbs[i].getAttribute('data-photo-id');
                    break;
                }
            }
        }

        // 显示/隐藏留言区域
        var commentsDiv = document.getElementById('viewerComments');
        if (commentsDiv) {
            if (photoId) {
                commentsDiv.style.display = '';
                loadPhotoComments(photoId);
            } else {
                commentsDiv.style.display = 'none';
            }
        }
    }

    // 监听查看器翻页事件，切换照片时重新加载留言
    var _originalSlideToIndex = null;
    // 由于 slideToIndex 在 main.js 的闭包中，我们通过监听 viewer-track 的 transform 变化来检测翻页
    (function() {
        var track = document.getElementById('viewerTrack');
        if (!track) return;
        var observer = new MutationObserver(function() {
            // track innerHTML 变化时（buildSlides 被调用）
        });
        // 使用更简单的方式：监听 prev/next 按钮点击后加载留言
        var prevBtn = document.getElementById('viewerPrev');
        var nextBtn = document.getElementById('viewerNext');
        if (prevBtn) {
            prevBtn.addEventListener('click', function() {
                setTimeout(loadViewerCommentsForCurrentSlide, 100);
            });
        }
        if (nextBtn) {
            nextBtn.addEventListener('click', function() {
                setTimeout(loadViewerCommentsForCurrentSlide, 100);
            });
        }
    })();

    // 回车键发送留言
    (function() {
        var commentContent = document.getElementById('commentContent');
        if (commentContent) {
            commentContent.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    submitComment();
                }
            });
        }
    })();

    // ========== 黑板留言 ==========
    // 便利贴背景颜色
    var boardNoteColors = ['#fffef8', '#fff9c4', '#e3f2fd', '#fce4ec', '#e8f5e9'];
    // 粉笔颜色选择器
    var boardChalkColors = [
        { color: '#ffffff', label: '白色' },
        { color: '#ffeb3b', label: '黄色' },
        { color: '#f48fb1', label: '粉色' },
        { color: '#81d4fa', label: '蓝色' },
        { color: '#a5d6a7', label: '绿色' },
        { color: '#ffcc80', label: '橙色' }
    ];

    var boardMessages = [];
    var boardCurrentPage = 1;
    var boardHasMore = false;
    var boardCurrentKeyword = '';
    var boardIsLoading = false;
    var boardSelectedChalkColor = boardChalkColors[0].color;
    var boardReadIds = JSON.parse(localStorage.getItem('board_read_ids') || '[]');

    function initBoard() {
        // 从localStorage恢复昵称
        var savedAuthor = localStorage.getItem('board_author');
        var boardAuthor = document.getElementById('boardAuthor');
        if (savedAuthor && boardAuthor) {
            boardAuthor.value = savedAuthor;
        }

        // 渲染颜色选择器
        renderBoardColorPicker();

        // 加载留言
        loadBoardMessages();

        // 绑定事件
        var boardSubmitBtn = document.getElementById('boardSubmitBtn');
        if (boardSubmitBtn) {
            boardSubmitBtn.addEventListener('click', submitBoardMessage);
        }

        var noteZoomedClose = document.getElementById('noteZoomedClose');
        if (noteZoomedClose) {
            noteZoomedClose.addEventListener('click', closeBoardZoom);
        }

        var noteOverlay = document.getElementById('noteOverlay');
        if (noteOverlay) {
            noteOverlay.addEventListener('click', function(e) {
                if (e.target === noteOverlay) closeBoardZoom();
            });
        }

        // 搜索框：输入防抖搜索
        var searchTimer = null;
        var searchInput = document.getElementById('boardSearchInput');
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(function() {
                    boardCurrentKeyword = searchInput.value.trim();
                    boardCurrentPage = 1;
                    boardMessages = [];
                    loadBoardMessages(false);
                }, 400);
            });
        }

        // 加载更多按钮
        var boardLoadMoreBtn = document.getElementById('boardLoadMoreBtn');
        if (boardLoadMoreBtn) {
            boardLoadMoreBtn.addEventListener('click', function() {
                boardCurrentPage++;
                loadBoardMessages(true);
            });
        }
    }

    function renderBoardColorPicker() {
        var boardColors = document.getElementById('boardColors');
        if (!boardColors) return;

        var html = '';
        boardChalkColors.forEach(function(item, i) {
            var activeClass = i === 0 ? ' active' : '';
            html += '<button class="color-btn' + activeClass + '" data-color="' + item.color + '" title="' + item.label + '"></button>';
        });
        boardColors.innerHTML = html;

        // 绑定颜色选择事件
        var btns = boardColors.querySelectorAll('.color-btn');
        btns.forEach(function(btn) {
            btn.addEventListener('click', function() {
                btns.forEach(function(b) { b.classList.remove('active'); });
                btn.classList.add('active');
                boardSelectedChalkColor = btn.getAttribute('data-color');
            });
        });
    }

    function loadBoardMessages(append) {
        if (boardIsLoading) return;
        boardIsLoading = true;

        var url = '/api/board?page=' + boardCurrentPage + '&limit=20';
        if (boardCurrentKeyword) url += '&keyword=' + encodeURIComponent(boardCurrentKeyword);

        var boardWall = document.getElementById('boardWall');
        var boardLoadMoreBtn = document.getElementById('boardLoadMoreBtn');

        if (!append) {
            if (boardWall) boardWall.innerHTML = '<div style="text-align:center;padding:1rem;color:var(--pencil);font-size:0.85rem;">加载中...</div>';
        } else {
            if (boardLoadMoreBtn) boardLoadMoreBtn.textContent = '加载中...';
        }

        fetch(url)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                boardIsLoading = false;
                var newMessages = data.messages || [];
                boardHasMore = data.has_more || false;

                if (append) {
                    boardMessages = boardMessages.concat(newMessages);
                } else {
                    boardMessages = newMessages;
                }
                renderBoardNotes(append);

                // 更新加载更多按钮
                var loadMoreDiv = document.getElementById('boardLoadMore');
                if (boardHasMore) {
                    if (loadMoreDiv) loadMoreDiv.style.display = 'block';
                    if (boardLoadMoreBtn) boardLoadMoreBtn.textContent = '翻翻过去的日记...';
                } else {
                    if (loadMoreDiv) loadMoreDiv.style.display = 'none';
                }
            })
            .catch(function(err) {
                boardIsLoading = false;
                console.error('加载留言失败:', err);
                if (!append && boardWall) {
                    boardWall.innerHTML = '<div style="text-align:center;padding:1rem;color:var(--accent-rose);font-size:0.85rem;">加载失败</div>';
                }
            });
    }

    function renderBoardNotes(append) {
        var boardWall = document.getElementById('boardWall');
        var boardEmpty = document.getElementById('boardEmpty');
        if (!boardWall) return;

        if (boardMessages.length === 0) {
            // 清空"加载中..."占位，避免残留
            boardWall.innerHTML = '';
            boardWall.style.display = 'none';
            if (boardEmpty) {
                if (boardCurrentKeyword) {
                    boardEmpty.querySelector('.empty-title').textContent = '没有找到匹配的留言，换个词试试';
                    boardEmpty.querySelector('.empty-desc').textContent = '';
                } else {
                    boardEmpty.querySelector('.empty-title').textContent = '黑板还是空的，来留下第一笔吧';
                    boardEmpty.querySelector('.empty-desc').textContent = '在黑板上写下你的植物心得';
                }
                boardEmpty.style.display = 'flex';
            }
            return;
        }
        boardWall.style.display = 'block';
        if (boardEmpty) boardEmpty.style.display = 'none';

        var html = '';
        if (append) {
            html = boardWall.innerHTML;
        }

        var toRender = append
            ? boardMessages.slice(boardMessages.length - (boardMessages.length - (boardCurrentPage - 1) * 20))
            : boardMessages;

        var sorted = toRender.slice().sort(function(a, b) {
            return (b.created_at || '').localeCompare(a.created_at || '');
        });

        sorted.forEach(function(msg) {
            if (append && boardWall.querySelector('.sticky-note[data-id="' + msg.id + '"]')) return;

            var isRead = isBoardMessageRead(msg.id);
            var readClass = isRead ? 'read' : 'unread';
            var bgColor = boardNoteColors[Math.abs(boardHashCode(msg.id)) % boardNoteColors.length];
            var rotation = (Math.random() * 6 - 3).toFixed(1);

            html += '<div class="sticky-note ' + readClass + '" data-id="' + msg.id + '" '
                + 'style="background:' + bgColor + '; transform:rotate(' + rotation + 'deg); --note-color:' + msg.chalkColor + ';">'
                + '<div class="sticky-pin"></div>'
                + '<button class="sticky-delete" data-id="' + msg.id + '" title="删除">&times;</button>'
                + '<div class="sticky-author" style="color:' + msg.chalkColor + ';">' + escapeHtml(msg.author) + '</div>'
                + '<div class="sticky-text">' + escapeHtml(msg.content) + '</div>'
                + '<div class="sticky-time">' + formatBoardTime(msg.created_at) + '</div>'
                + '</div>';
        });
        boardWall.innerHTML = html;

        bindBoardNoteEvents();
    }

    function bindBoardNoteEvents() {
        var boardWall = document.getElementById('boardWall');
        if (!boardWall) return;
        var notes = boardWall.querySelectorAll('.sticky-note');

        notes.forEach(function(note) {
            note.addEventListener('click', function(e) {
                if (e.target.classList.contains('sticky-delete')) return;

                var id = note.getAttribute('data-id');
                markBoardAsRead(id);
                note.classList.remove('unread');
                note.classList.add('read');
                zoomBoardNote(note);
            });

            var deleteBtn = note.querySelector('.sticky-delete');
            if (deleteBtn) {
                deleteBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var id = deleteBtn.getAttribute('data-id');
                    deleteBoardMessage(id);
                });
            }
        });
    }

    function submitBoardMessage() {
        var boardAuthor = document.getElementById('boardAuthor');
        var boardContent = document.getElementById('boardContent');
        var author = boardAuthor ? (boardAuthor.value.trim() || '匿名') : '匿名';
        var content = boardContent ? boardContent.value.trim() : '';
        var color = boardSelectedChalkColor;

        if (!content) {
            showToast('请输入留言内容', 'error');
            return;
        }

        fetch('/api/board', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({author: author, content: content, color: color})
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                if (boardContent) boardContent.value = '';
                localStorage.setItem('board_author', author);
                boardCurrentPage = 1;
                boardMessages = [];
                loadBoardMessages(false);
                showToast('留言发布成功', 'success');
            } else {
                showToast(data.message || '发布失败', 'error');
            }
        })
        .catch(function(err) {
            showToast('网络错误', 'error');
        });
    }

    function deleteBoardMessage(id) {
        showModal('确认删除', '确定要删除这条留言吗？', function() {
            fetch('/api/board/' + id, {method: 'DELETE'})
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.success) {
                        boardCurrentPage = 1;
                        boardMessages = [];
                        loadBoardMessages(false);
                        showToast('已删除', 'success');
                    }
                });
        });
    }

    function zoomBoardNote(noteEl) {
        var id = noteEl.getAttribute('data-id');
        var msg = boardMessages.find(function(m) { return m.id == id; });
        if (!msg) return;

        var bgColor = boardNoteColors[Math.abs(boardHashCode(msg.id)) % boardNoteColors.length];
        var noteZoomed = document.getElementById('noteZoomed');
        var noteZoomedContent = document.getElementById('noteZoomedContent');
        var noteOverlay = document.getElementById('noteOverlay');

        if (noteZoomedContent) {
            noteZoomedContent.innerHTML =
                '<div class="note-zoomed-author" style="color:' + msg.chalkColor + ';">' + escapeHtml(msg.author) + '</div>'
                + '<div class="note-zoomed-text">' + escapeHtml(msg.content) + '</div>'
                + '<div class="note-zoomed-time">' + formatBoardTime(msg.created_at) + '</div>';
        }

        if (noteZoomed) noteZoomed.style.background = bgColor;
        if (noteOverlay) {
            noteOverlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        }
    }

    function closeBoardZoom() {
        var noteOverlay = document.getElementById('noteOverlay');
        if (noteOverlay) {
            noteOverlay.classList.remove('show');
            document.body.style.overflow = '';
        }
    }

    function isBoardMessageRead(id) {
        return boardReadIds.indexOf(id) !== -1;
    }

    function markBoardAsRead(id) {
        if (boardReadIds.indexOf(id) === -1) {
            boardReadIds.push(id);
            localStorage.setItem('board_read_ids', JSON.stringify(boardReadIds));
        }
    }

    function boardHashCode(str) {
        var hash = 0;
        for (var i = 0; i < str.length; i++) {
            hash = ((hash << 5) - hash) + str.charCodeAt(i);
            hash |= 0;
        }
        return hash;
    }

    function formatBoardTime(ts) {
        if (!ts) return '';
        var d = new Date(ts);
        var month = d.getMonth() + 1;
        var day = d.getDate();
        var hour = d.getHours().toString().padStart(2, '0');
        var min = d.getMinutes().toString().padStart(2, '0');
        return month + '月' + day + '日 ' + hour + ':' + min;
    }

    // ========== 初始化 ==========
    initCalendar();
    loadRecords(false);

    (function openInitialTabFromUrl() {
        var params = new URLSearchParams(window.location.search);
        var initialTab = params.get('tab');
        if (['list', 'calendar', 'board', 'tags'].indexOf(initialTab) !== -1) {
            switchTab(initialTab);
        }
    })();

    // 监听全局排序变化，刷新当前数据
    window.addEventListener('sortOrderChanged', function() {
        // 重置记录列表
        recordsList.innerHTML = '';
        recordCounter = 0;
        currentPage = 1;
        hasMore = true;
        listLoaded = false;
        loadRecords(false);
        // 重置标签筛选
        if (activeTagIds.length > 0) {
            loadTagFilterResult();
        }
    });
</script>
{% endblock %}
