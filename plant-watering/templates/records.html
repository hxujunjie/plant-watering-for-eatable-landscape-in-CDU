{% extends "base.html" %}

{% block title %}浇水记录{% endblock %}

{% block content %}
<!-- 页面头部 -->
<div class="header">
    <span class="header-icon">📋</span>
    <h1>浇水记录</h1>
</div>

<!-- 标签页切换 -->
<div class="tabs">
    <button class="tab active" data-tab="list">签到列表</button>
    <button class="tab" data-tab="calendar">日历</button>
    <button class="tab" data-tab="photos">照片集</button>
</div>

<!-- 签到列表 -->
<div class="tab-content active" id="tabList">
    <div id="recordsList"></div>
    <div class="empty-state" id="listEmpty">
        <div class="empty-icon">🌱</div>
        <div class="empty-title">还没有记录</div>
        <div class="empty-desc">快来浇第一滴水吧</div>
    </div>
    <div class="load-more-wrapper" id="loadMoreWrapper">
        <button class="btn-load-more" id="loadMoreBtn">加载更多</button>
    </div>
</div>

<!-- 日历视图 -->
<div class="tab-content" id="tabCalendar">
    <div class="calendar-nav">
        <button class="cal-nav-btn" id="calPrev">&lt;</button>
        <span class="cal-month-label" id="calMonthLabel"></span>
        <button class="cal-nav-btn" id="calNext">&gt;</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="cal-detail" id="calDetail"></div>
    <div class="empty-state" id="calendarEmpty">
        <div class="empty-icon">📅</div>
        <div class="empty-title">本月暂无记录</div>
        <div class="empty-desc">浇水后这里会显示绿色标记</div>
    </div>
</div>

<!-- 照片集 -->
<div class="tab-content" id="tabPhotos">
    <div id="photosContainer"></div>
    <div class="empty-state" id="photosEmpty">
        <div class="empty-icon">📷</div>
        <div class="empty-title">还没有照片</div>
        <div class="empty-desc">签到时上传照片，这里会展示</div>
    </div>
</div>

<!-- 备份与恢复 -->
<details class="backup-panel" id="backupPanel" style="display:none;">
    <summary>🛡️ 备份与恢复</summary>
    <div class="backup-body">
        <p class="backup-tip">输入管理员密码后才可下载、推送或恢复。所有数据自动备份到你的 GitHub 私有仓库。</p>
        <div class="backup-row">
            <input type="password" id="adminPwd" class="backup-input" placeholder="管理员密码" autocomplete="off">
        </div>
        <div class="backup-row backup-actions">
            <button type="button" class="btn-backup" id="btnDownloadBackup">下载完整备份</button>
            <button type="button" class="btn-backup" id="btnPushBackup">立即推送到 GitHub</button>
        </div>
        <div class="backup-row">
            <label class="backup-file-label">
                <input type="file" id="restoreFile" accept=".zip" style="display:none;">
                <span id="restoreFileName">选择备份 zip 文件…</span>
            </label>
            <button type="button" class="btn-backup btn-restore" id="btnRestore">从备份恢复</button>
        </div>
        <div class="backup-status" id="backupStatus"></div>
    </div>
</details>
{% endblock %}

{% block scripts %}
<script>
(function() {
    // ========== 状态变量 ==========
    var currentPage = 1;
    var hasMore = true;
    var listLoaded = false;
    var calendarLoaded = false;
    var photosLoaded = false;
    var calYear, calMonth;

    // ========== Tab 切换逻辑 ==========
    var tabs = document.querySelectorAll('.tab');
    var tabContents = document.querySelectorAll('.tab-content');

    tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            var targetTab = this.getAttribute('data-tab');

            // 切换 tab 样式
            tabs.forEach(function(t) { t.classList.remove('active'); });
            this.classList.add('active');

            // 切换内容区域
            tabContents.forEach(function(tc) { tc.classList.remove('active'); });
            document.getElementById('tab' + targetTab.charAt(0).toUpperCase() + targetTab.slice(1)).classList.add('active');

            // 按需加载数据
            if (targetTab === 'list' && !listLoaded) {
                loadRecords(false);
            } else if (targetTab === 'calendar' && !calendarLoaded) {
                calendarLoaded = true;
                initCalendar();
                loadCalendar();
            } else if (targetTab === 'photos' && !photosLoaded) {
                loadPhotos();
            }
        });
    });

    // ========== 签到列表 ==========
    function loadRecords(append) {
        var recordsList = document.getElementById('recordsList');
        var listEmpty = document.getElementById('listEmpty');
        var loadMoreWrapper = document.getElementById('loadMoreWrapper');
        var loadMoreBtn = document.getElementById('loadMoreBtn');

        if (!append) {
            currentPage = 1;
            hasMore = true;
            recordsList.innerHTML = '';
        }

        loadMoreBtn.disabled = true;
        loadMoreBtn.textContent = '加载中...';

        fetch('/api/logs?page=' + currentPage)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var logs = data.logs || [];
                if (logs.length === 0 && !append) {
                    listEmpty.style.display = '';
                    loadMoreWrapper.style.display = 'none';
                } else {
                    listEmpty.style.display = 'none';
                    logs.forEach(function(log) {
                        recordsList.appendChild(renderRecordItem(log));
                    });
                    bindRecordEvents();
                    if (logs.length < 20) {
                        hasMore = false;
                        loadMoreWrapper.style.display = 'none';
                    } else {
                        loadMoreWrapper.style.display = '';
                    }
                }
                listLoaded = true;
            })
            .catch(function() {
                showToast('加载记录失败');
            })
            .finally(function() {
                loadMoreBtn.disabled = false;
                loadMoreBtn.textContent = '加载更多';
            });
    }

    function renderRecordItem(log) {
        var item = document.createElement('div');
        item.className = 'record-item';
        item.setAttribute('data-id', log.id);

        // 头像：取名字首字
        var avatar = document.createElement('div');
        avatar.className = 'record-avatar';
        avatar.textContent = log.name ? log.name.charAt(0) : '?';

        // 内容区
        var content = document.createElement('div');
        content.className = 'record-info';

        var nameSpan = document.createElement('span');
        nameSpan.className = 'record-name';
        nameSpan.textContent = log.name || '未知';

        var timeSpan = document.createElement('span');
        timeSpan.className = 'record-time';
        timeSpan.textContent = formatTime(log.created_at);

        content.appendChild(nameSpan);
        content.appendChild(timeSpan);

        // 照片缩略图
        if (log.photos && log.photos.length > 0) {
            var thumbs = document.createElement('div');
            thumbs.className = 'record-photos';
            log.photos.forEach(function(photo) {
                var img = document.createElement('img');
                img.className = 'record-thumb';
                img.src = photo.file_path || photo.path;
                img.alt = '照片';
                img.loading = 'lazy';
                img.addEventListener('click', function() {
                    openViewer(img);
                });
                thumbs.appendChild(img);
            });
            content.appendChild(thumbs);
        }

        // 撤销按钮
        var undoBtn = document.createElement('button');
        undoBtn.className = 'btn-undo';
        undoBtn.textContent = '撤销';
        undoBtn.setAttribute('data-id', log.id);

        item.appendChild(avatar);
        item.appendChild(content);
        item.appendChild(undoBtn);

        return item;
    }

    function formatTime(timeStr) {
        if (!timeStr) return '';
        var d = new Date(timeStr.replace(/-/g, '/'));
        var now = new Date();
        var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        var target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        var diffDays = Math.floor((today - target) / (1000 * 60 * 60 * 24));

        var hh = String(d.getHours()).padStart(2, '0');
        var mm = String(d.getMinutes()).padStart(2, '0');
        var timePart = hh + ':' + mm;

        if (diffDays === 0) return '今天 ' + timePart;
        if (diffDays === 1) return '昨天 ' + timePart;
        if (diffDays === 2) return '前天 ' + timePart;

        var month = d.getMonth() + 1;
        var day = d.getDate();
        if (d.getFullYear() === now.getFullYear()) {
            return month + '月' + day + '日 ' + timePart;
        }
        return d.getFullYear() + '/' + month + '/' + day + ' ' + timePart;
    }

    function bindRecordEvents() {
        var undoBtns = document.querySelectorAll('.btn-undo');
        undoBtns.forEach(function(btn) {
            // 避免重复绑定
            if (btn.getAttribute('data-bound')) return;
            btn.setAttribute('data-bound', '1');

            btn.addEventListener('click', function() {
                var id = this.getAttribute('data-id');
                showModal('确认撤销', '确定要撤销这条浇水记录吗？', function() {
                    fetch('/api/delete/' + id, { method: 'DELETE' })
                        .then(function(res) { return res.json(); })
                        .then(function(data) {
                            if (data.success) {
                                showToast('已撤销');
                                refreshViewsAfterDelete();
                                var item = document.querySelector('.record-item[data-id="' + id + '"]');
                                if (item) {
                                    item.style.transition = 'all 0.3s ease';
                                    item.style.opacity = '0';
                                    item.style.transform = 'translateX(100%)';
                                    item.style.maxHeight = item.scrollHeight + 'px';
                                    setTimeout(function() {
                                        item.style.maxHeight = '0';
                                        item.style.padding = '0';
                                        item.style.margin = '0';
                                    }, 300);
                                    setTimeout(function() {
                                        item.remove();
                                        // 检查列表是否为空
                                        var recordsList = document.getElementById('recordsList');
                                        if (recordsList.children.length === 0) {
                                            document.getElementById('listEmpty').style.display = '';
                                            document.getElementById('loadMoreWrapper').style.display = 'none';
                                        }
                                    }, 600);
                                }
                            } else {
                                showToast(data.message || '撤销失败');
                            }
                        })
                        .catch(function() {
                            showToast('网络错误，请重试');
                        });
                });
            });
        });
    }

    function refreshViewsAfterDelete() {
        calendarLoaded = false;
        photosLoaded = false;

        var calendarTab = document.getElementById('tabCalendar');
        if (calendarTab && calendarTab.classList.contains('active')) {
            calendarLoaded = true;
            loadCalendar();
        }

        var photosTab = document.getElementById('tabPhotos');
        if (photosTab && photosTab.classList.contains('active')) {
            photosLoaded = true;
            loadPhotos();
        }
    }

    // 加载更多按钮
    document.getElementById('loadMoreBtn').addEventListener('click', function() {
        if (hasMore) {
            currentPage++;
            loadRecords(true);
        }
    });

    // ========== 日历视图 ==========
    function initCalendar() {
        var now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth() + 1;
        updateCalLabel();
    }

    function updateCalLabel() {
        document.getElementById('calMonthLabel').textContent = calYear + '年' + calMonth + '月';
    }

    function loadCalendar() {
        var calendarGrid = document.getElementById('calendarGrid');
        var calendarEmpty = document.getElementById('calendarEmpty');
        var calDetail = document.getElementById('calDetail');
        calDetail.innerHTML = '';

        fetch('/api/calendar?year=' + calYear + '&month=' + calMonth)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var dates = data.dates || [];
                renderCalendar(dates);
                if (dates.length === 0) {
                    calendarEmpty.style.display = '';
                } else {
                    calendarEmpty.style.display = 'none';
                }
            })
            .catch(function() {
                showToast('加载日历失败');
            });
    }

    function renderCalendar(markedDates) {
        var grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        // 星期标题行
        var weekHeaders = ['日', '一', '二', '三', '四', '五', '六'];
        weekHeaders.forEach(function(w) {
            var cell = document.createElement('div');
            cell.className = 'cal-header';
            cell.textContent = w;
            grid.appendChild(cell);
        });

        // 计算本月第一天星期几和天数
        var firstDay = new Date(calYear, calMonth - 1, 1).getDay();
        var daysInMonth = new Date(calYear, calMonth, 0).getDate();
        var today = new Date();
        var todayYear = today.getFullYear();
        var todayMonth = today.getMonth() + 1;
        var todayDate = today.getDate();

        // 标记日期集合（用于快速查找）
        var markedSet = {};
        markedDates.forEach(function(d) {
            // d 可能是 "2026-06-10" 格式，提取日号
            var parts = d.split('-');
            var dayNum = parts.length === 3 ? parseInt(parts[2], 10) : parseInt(d, 10);
            markedSet[dayNum] = true;
        });

        // 前面的空白格
        for (var i = 0; i < firstDay; i++) {
            var empty = document.createElement('div');
            empty.className = 'cal-day empty';
            grid.appendChild(empty);
        }

        // 日期格
        for (var day = 1; day <= daysInMonth; day++) {
            var cell = document.createElement('div');
            cell.className = 'cal-day';
            cell.textContent = day;

            if (markedSet[day]) {
                cell.classList.add('marked');
            }
            if (calYear === todayYear && calMonth === todayMonth && day === todayDate) {
                cell.classList.add('today');
            }

            // 绑定点击加载详情
            (function(d) {
                cell.addEventListener('click', function() {
                    // 高亮选中
                    grid.querySelectorAll('.cal-day').forEach(function(c) {
                        c.classList.remove('selected');
                    });
                    this.classList.add('selected');
                    loadCalendarDetail(d);
                });
            })(day);

            grid.appendChild(cell);
        }
    }

    function loadCalendarDetail(day) {
        var calDetail = document.getElementById('calDetail');
        calDetail.innerHTML = '<div class="cal-detail-loading">加载中...</div>';
        calDetail.classList.add('show');

        fetch('/api/calendar/detail?year=' + calYear + '&month=' + calMonth + '&day=' + day)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var logs = data.logs || [];
                if (logs.length === 0) {
                    calDetail.innerHTML = '<div class="cal-detail-empty">当天暂无记录</div>';
                    return;
                }
                calDetail.innerHTML = '';
                logs.forEach(function(log) {
                    var item = document.createElement('div');
                    item.className = 'cal-detail-item';

                    var avatar = document.createElement('div');
                    avatar.className = 'cal-detail-avatar';
                    avatar.textContent = log.name ? log.name.charAt(0) : '?';

                    var info = document.createElement('div');
                    info.className = 'cal-detail-info';

                    var nameSpan = document.createElement('span');
                    nameSpan.className = 'cal-detail-name';
                    nameSpan.textContent = log.name || '未知';

                    var timeSpan = document.createElement('span');
                    timeSpan.className = 'cal-detail-time';
                    timeSpan.textContent = log.created_at ? log.created_at.split(' ')[1] || '' : '';

                    info.appendChild(nameSpan);
                    info.appendChild(timeSpan);

                    // 照片缩略图
                    if (log.photos && log.photos.length > 0) {
                        var thumbs = document.createElement('div');
                        thumbs.className = 'cal-detail-thumbs';
                        log.photos.forEach(function(photo) {
                            var img = document.createElement('img');
                            img.className = 'cal-detail-thumb';
                            img.src = photo.file_path || photo.path;
                            img.alt = '照片';
                            img.loading = 'lazy';
                            img.addEventListener('click', function() {
                                openViewer(img);
                            });
                            thumbs.appendChild(img);
                        });
                        info.appendChild(thumbs);
                    }

                    item.appendChild(avatar);
                    item.appendChild(info);
                    calDetail.appendChild(item);
                });
            })
            .catch(function() {
                calDetail.innerHTML = '<div class="cal-detail-empty">加载失败</div>';
            });
    }

    // 日历月份切换
    document.getElementById('calPrev').addEventListener('click', function() {
        calMonth--;
        if (calMonth < 1) {
            calMonth = 12;
            calYear--;
        }
        updateCalLabel();
        loadCalendar();
    });

    document.getElementById('calNext').addEventListener('click', function() {
        calMonth++;
        if (calMonth > 12) {
            calMonth = 1;
            calYear++;
        }
        updateCalLabel();
        loadCalendar();
    });

    // ========== 照片集 ==========
    function loadPhotos() {
        var container = document.getElementById('photosContainer');
        var photosEmpty = document.getElementById('photosEmpty');

        fetch('/api/photos')
            .then(function(res) { return res.json(); })
            .then(function(data) {
                var groups = data.groups || {};
                // groups 可能是对象（按日期分组）或数组
                var groupKeys = Array.isArray(groups) ? groups.map(function(g) { return g.date; }) : Object.keys(groups);
                if (groupKeys.length === 0) {
                    photosEmpty.style.display = '';
                    return;
                }
                photosEmpty.style.display = 'none';
                photosLoaded = true;

                container.innerHTML = '';
                groupKeys.forEach(function(dateKey) {
                    var photos = Array.isArray(groups) ? groups[groupKeys.indexOf(dateKey)].photos : groups[dateKey];
                    var groupEl = document.createElement('div');
                    groupEl.className = 'photo-group';

                    var dateLabel = document.createElement('div');
                    dateLabel.className = 'photo-date';
                    dateLabel.textContent = dateKey || '';
                    groupEl.appendChild(dateLabel);

                    var photoGrid = document.createElement('div');
                    photoGrid.className = 'photo-grid';

                    var photoUrls = (photos || []).map(function(photo) {
                        return photo.file_path || photo.path;
                    }).filter(Boolean);

                    (photos || []).forEach(function(photo, index) {
                        var item = document.createElement('div');
                        item.className = 'photo-item';
                        var img = document.createElement('img');
                        img.src = photo.file_path || photo.path;
                        img.alt = '照片';
                        img.loading = 'lazy';
                        img.addEventListener('click', function() {
                            openViewerFromUrls(photoUrls, index);
                        });
                        item.appendChild(img);
                        photoGrid.appendChild(item);
                    });

                    groupEl.appendChild(photoGrid);
                    container.appendChild(groupEl);
                });
            })
            .catch(function() {
                showToast('加载照片失败');
            });
    }

    // ========== 初始化 ==========
    initCalendar();
    loadRecords(false);
    initBackupPanel();

    // ========== 备份与恢复 ==========
    function initBackupPanel() {
        var panel = document.getElementById('backupPanel');
        if (!panel) return;
        fetch('/api/backup/status').then(function(r){ return r.json(); }).then(function(data){
            // 只要后端配置了密码就显示面板（即使 GitHub 没配也能下载本地 zip）
            if (data && data.has_password) {
                panel.style.display = '';
                bindBackupHandlers(data);
            }
        }).catch(function(){});
    }

    function bindBackupHandlers(status) {
        var pwdInput = document.getElementById('adminPwd');
        var statusBox = document.getElementById('backupStatus');
        var fileInput = document.getElementById('restoreFile');
        var fileName = document.getElementById('restoreFileName');
        var btnDownload = document.getElementById('btnDownloadBackup');
        var btnPush = document.getElementById('btnPushBackup');
        var btnRestore = document.getElementById('btnRestore');

        function setStatus(text, isErr) {
            statusBox.textContent = text || '';
            statusBox.className = 'backup-status' + (isErr ? ' err' : '');
        }
        function getPwd() {
            var v = (pwdInput.value || '').trim();
            if (!v) { setStatus('请先输入管理员密码', true); pwdInput.focus(); }
            return v;
        }

        if (!status.configured) {
            btnPush.disabled = true;
            btnPush.title = '后端未配置 GitHub Token/Repo';
        }

        // 下载完整备份（POST + 密码 → 二进制下载）
        btnDownload.addEventListener('click', function() {
            var pwd = getPwd();
            if (!pwd) return;
            setStatus('正在打包…');
            var fd = new FormData();
            fd.append('admin_password', pwd);
            fetch('/admin/backup', { method: 'POST', body: fd })
                .then(function(res) {
                    if (!res.ok) {
                        return res.json().then(function(j){ throw new Error(j.error || '失败'); });
                    }
                    var disp = res.headers.get('Content-Disposition') || '';
                    var m = disp.match(/filename="?([^";]+)"?/);
                    var name = m ? m[1] : 'backup.zip';
                    return res.blob().then(function(b){ return { blob: b, name: name }; });
                })
                .then(function(obj) {
                    var url = URL.createObjectURL(obj.blob);
                    var a = document.createElement('a');
                    a.href = url; a.download = obj.name;
                    document.body.appendChild(a); a.click(); a.remove();
                    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
                    setStatus('下载完成 ' + obj.name);
                })
                .catch(function(e) { setStatus(e.message || '下载失败', true); });
        });

        // 立即推送到 GitHub
        btnPush.addEventListener('click', function() {
            var pwd = getPwd();
            if (!pwd) return;
            setStatus('正在推送到 GitHub，可能需要几秒…');
            btnPush.disabled = true;
            var fd = new FormData();
            fd.append('admin_password', pwd);
            fetch('/admin/backup/push', { method: 'POST', body: fd })
                .then(function(r){ return r.json(); })
                .then(function(j) {
                    if (j.success) {
                        var info = j.info || {};
                        setStatus('推送成功 ' + (info.snapshot || '') + '（' + Math.round((info.size||0)/1024) + ' KB）');
                    } else {
                        setStatus(j.error || '推送失败', true);
                    }
                })
                .catch(function(){ setStatus('网络错误', true); })
                .finally(function(){ btnPush.disabled = !status.configured ? true : false; });
        });

        // 选择恢复文件
        fileInput.addEventListener('change', function() {
            if (fileInput.files && fileInput.files[0]) {
                fileName.textContent = fileInput.files[0].name;
            } else {
                fileName.textContent = '选择备份 zip 文件…';
            }
        });

        // 恢复
        btnRestore.addEventListener('click', function() {
            var pwd = getPwd();
            if (!pwd) return;
            if (!fileInput.files || !fileInput.files[0]) {
                setStatus('请先选择备份 zip', true); return;
            }
            showModal('确认恢复', '恢复会覆盖当前的全部数据，确定继续吗？', function() {
                setStatus('正在恢复…');
                var fd = new FormData();
                fd.append('admin_password', pwd);
                fd.append('backup_file', fileInput.files[0]);
                fetch('/admin/restore', { method: 'POST', body: fd })
                    .then(function(r){ return r.json(); })
                    .then(function(j) {
                        if (j.success) {
                            setStatus('恢复成功，2 秒后刷新页面…');
                            setTimeout(function(){ location.reload(); }, 2000);
                        } else {
                            setStatus(j.error || '恢复失败', true);
                        }
                    })
                    .catch(function(){ setStatus('网络错误', true); });
            });
        });
    }
})();
</script>
{% endblock %}
